<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Capturador de códigos L&P</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#eef4fb;color:#111827}
header{background:#0666f5;color:#fff;padding:14px;text-align:center;position:sticky;top:0}
main{max-width:720px;margin:auto;padding:10px}.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px}
#nombre{font-size:28px;line-height:1.15;margin:12px 0}#codigo,#categoria{color:#475569;margin:5px 0}
input{width:100%;font-size:24px;padding:15px;border:3px solid #93c5fd;border-radius:14px;margin-top:12px;text-align:center}
button{width:100%;padding:14px;border:0;border-radius:12px;margin-top:10px;font-size:17px;font-weight:bold;background:#0666f5;color:white}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.camera{background:#7c3aed}.green{background:#15803d}.secondary{background:#334155}.warn{background:#b45309}
#reader{display:none;margin-top:12px}.status{font-weight:bold;margin-top:10px}.small{font-size:13px;color:#64748b}
</style>
</head>
<body>
<header><strong>Capturador de códigos L&P</strong></header>
<main>
<div class="card">
<div id="progreso"></div>
<h1 id="nombre">Cargando...</h1>
<div id="codigo"></div>
<div id="categoria"></div>
<button class="camera" onclick="abrirCamara()">📷 Abrir cámara</button>
<div id="reader"></div>
<input id="barcode" inputmode="numeric" placeholder="Escanea o escribe el código">
<button class="green" onclick="guardarYSeguir()">Guardar y siguiente</button>
<div class="row">
<button class="secondary" onclick="anterior()">Anterior</button>
<button class="warn" onclick="saltar()">Saltar</button>
</div>
<div id="estado" class="status"></div>
<p class="small">Cada código se guarda en el servidor para usarlo en futuros pedidos.</p>
</div>
<div class="card">
<input id="buscar" placeholder="Buscar producto">
<button onclick="buscarProducto()">Ir al producto</button>
<div class="row">
<button class="secondary" onclick="exportarCSV()">Exportar CSV</button>
<button class="secondary" onclick="exportarJSON()">Exportar respaldo</button>
</div>
</div>
</main>

  document.getElementById("estado").textContent="Guardado en el servidor. Siguiente producto.";
 }catch(e){
  document.getElementById("estado").textContent="No se guardó en el servidor: "+e.message;
 }
}
function anterior(){if(indice>0)indice--;render()}
function saltar(){if(indice<PRODUCTOS.length-1)indice++;render()}
function buscarProducto(){
 const q=document.getElementById("buscar").value.toLowerCase().trim();
 const i=PRODUCTOS.findIndex(p=>(p.nombre+" "+p.codigo).toLowerCase().includes(q));
 if(i>=0){indice=i;render()}else alert("Producto no encontrado");
}
function download(n,c,t){const b=new Blob([c],{type:t}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=n;a.click()}
function exportarCSV(){
 const rows=[["Producto QuickBooks","Nombre visible","Categoría","Código de barras","Estado"]];
 PRODUCTOS.forEach(p=>rows.push([p.codigo,p.nombre,p.categoria,capturas[p.codigo]||"",capturas[p.codigo]?"Capturado":"Pendiente"]));
 const csv=rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\n");
 download("codigos_barras_lnp.csv","\ufeff"+csv,"text/csv;charset=utf-8");
}
function exportarJSON(){download("respaldo_codigos_barras_lnp.json",JSON.stringify({indice,capturas,total:PRODUCTOS.length},null,2),"application/json")}
input.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();guardarYSeguir()}});
async function cargarGuardadosServidor(){
 try{
  const r=await fetch("/barcodes",{cache:"no-store"});
  if(!r.ok)return;
  const data=await r.json();
  data.forEach(x=>{const key=x.productCode||x.itemId;if(key&&x.barcode)capturas[key]=String(x.barcode)});
  save();
 }catch(e){console.warn("No se pudieron cargar códigos del servidor",e)}
}
cargarGuardadosServidor().finally(render);
</script>
</body>
