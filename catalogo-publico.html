<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2948d8">
  <title>Catálogo | Distribuidora L&amp;P</title>
  <style>
    :root {
      --azul: #2948d8;
      --azul-oscuro: #17245f;
      --borde: #dfe4f2;
      --fondo: #f6f8fc;
      --texto: #172033;
      --muted: #65708a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--fondo);
      color: var(--texto);
      font-family: Arial, Helvetica, sans-serif;
    }
    header {
      background: linear-gradient(135deg, #007bff, #0056d6);
      border-bottom: 1px solid var(--borde);
      padding: 20px 18px 24px;
      position: static;
      z-index: 10;
    }
    .encabezado {
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
    }
    .logo {
      width: 80%;
      max-width: 330px;
      height: auto;
      max-height: none;
      object-fit: contain;
      border-radius: 0;
      background: transparent;
    }
    h1 {
      margin: 0;
      color: #fff;
      font-size: clamp(22px, 4vw, 34px);
    }
    .subtitulo { color: #eaf2ff; margin-top: 2px; font-size: 15px; }
    .admin-button {
      margin: 8px auto 0;
      border: 1px solid var(--azul);
      background: #fff;
      color: var(--azul);
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .admin-button:hover { background: var(--azul); color: #fff; }
    main {
      max-width: 1240px;
      margin: 0 auto;
      padding: 22px 18px 45px;
    }
    .barra {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    #buscar {
      flex: 1 1 300px;
      min-height: 46px;
      padding: 0 16px;
      border: 1px solid #cbd3e6;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      background: #fff;
    }
    #buscar:focus {
      border-color: var(--azul);
      box-shadow: 0 0 0 3px rgba(41, 72, 216, .12);
    }
    #estado { color: var(--muted); font-size: 13px; min-height: 20px; }
    #adminPanel {
      display: none;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      background: #eef2ff;
      border: 1px solid #b7c4ff;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 18px;
      color: #23347f;
    }
    #adminPanel.visible { display: flex; }
    #adminPanel strong { color: var(--azul-oscuro); }
    .admin-help { flex: 1 1 300px; font-size: 13px; }
    #salirAdmin {
      border: 1px solid #6472b4;
      background: #fff;
      color: #23347f;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: 700;
    }
    #mensajeAdmin { width: 100%; color: #1c6b3c; font-size: 13px; min-height: 16px; }
    #categorias {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      position: sticky;
      top: 0;
      z-index: 8;
      background: var(--fondo);
      padding: 10px 0 12px;
      margin: 0 0 22px;
      box-shadow: 0 3px 8px rgba(31, 48, 93, .08);
    }
    .categoria {
      border: 2px solid var(--azul);
      background: #fff;
      color: var(--azul);
      border-radius: 12px;
      padding: 10px 17px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }
    .categoria.activa, .categoria:hover { background: var(--azul); color: #fff; }
    #productos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
      gap: 18px;
    }
    .producto {
      background: #fff;
      border: 1px solid var(--borde);
      border-radius: 16px;
      padding: 16px;
      min-height: 335px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      box-shadow: 0 3px 12px rgba(31, 48, 93, .06);
      transition: border-color .15s, box-shadow .15s;
    }
    .producto.admin-editable { border: 2px dashed #8696ea; }
    .producto.arrastrando {
      border-color: #1b8e52;
      box-shadow: 0 0 0 4px rgba(27, 142, 82, .16);
      background: #f1fff6;
    }
    .producto img {
      width: 100%;
      height: 170px;
      object-fit: contain;
      border-radius: 10px;
      background: #fff;
      cursor: zoom-in;
    }
    .producto.admin-editable img { cursor: copy; }
    .producto h2 {
      font-size: 17px;
      line-height: 1.18;
      text-align: center;
      margin: 14px 0 8px;
      min-height: 42px;
    }
    .precio {
      color: var(--azul);
      font-size: 21px;
      font-weight: 800;
      text-align: center;
      margin-top: auto;
    }
    .categoria-producto {
      color: var(--muted);
      text-align: center;
      font-size: 12px;
      margin-top: 8px;
    }
    .categoria-editor {
      width: 100%;
      margin-top: 10px;
      border: 1px solid #8e76dc;
      border-radius: 9px;
      padding: 8px 9px;
      background: #fbf9ff;
      color: #222;
      font-size: 14px;
    }
    .admin-hint {
      color: #53639f;
      text-align: center;
      font-size: 11px;
      margin-top: 7px;
    }
    #paginacion {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 28px;
    }
    #paginacion button {
      border: 1px solid var(--azul);
      background: #fff;
      color: var(--azul);
      border-radius: 9px;
      padding: 9px 14px;
      font-weight: 700;
      cursor: pointer;
    }
    #paginacion button:disabled { opacity: .45; cursor: not-allowed; }
    .vacio {
      grid-column: 1 / -1;
      background: #fff;
      border: 1px dashed #b8c2d9;
      border-radius: 14px;
      padding: 40px 18px;
      text-align: center;
      color: var(--muted);
    }
    #visor, #loginModal {
      position: fixed;
      inset: 0;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 20;
    }
    #visor {
      display: none;
      background: rgba(10, 18, 42, .82);
      cursor: zoom-out;
    }
    #visor.abierto { display: flex; }
    #visor img {
      max-width: min(92vw, 720px);
      max-height: 82vh;
      object-fit: contain;
      background: #fff;
      border-radius: 12px;
    }
    #loginModal {
      display: none;
      background: rgba(10, 18, 42, .62);
      z-index: 30;
    }
    #loginModal.abierto { display: flex; }
    .login-card {
      width: min(410px, 100%);
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 18px 60px rgba(0, 0, 0, .28);
      position: relative;
    }
    .login-card h2 { margin: 0 0 8px; color: var(--azul-oscuro); }
    .login-card p { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
    #adminPassword {
      width: 100%;
      min-height: 44px;
      border: 1px solid #cbd3e6;
      border-radius: 9px;
      padding: 0 12px;
      font-size: 16px;
      margin-bottom: 12px;
    }
    #entrarAdmin {
      width: 100%;
      min-height: 44px;
      border: 0;
      border-radius: 9px;
      background: var(--azul);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    #cerrarLogin {
      position: absolute;
      right: 12px;
      top: 10px;
      border: 0;
      background: transparent;
      color: #66708a;
      font-size: 25px;
      cursor: pointer;
    }
    #loginError { color: #b3261e; font-size: 13px; margin-top: 10px; min-height: 17px; }
    @media (max-width: 560px) {
      header { padding: 14px 14px 12px; }
      main { padding: 16px 12px 35px; }
      .encabezado { align-items: center; }
      .logo { width: 92%; max-width: 270px; height: auto; }
      .admin-button { margin: 8px auto 0; padding: 8px 10px; font-size: 12px; }
      #productos { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; }
      .producto { padding: 10px; min-height: 320px; border-radius: 12px; }
      .producto img { height: 130px; }
      .producto h2 { font-size: 14px; }
      .precio { font-size: 18px; }
      .categoria { padding: 8px 11px; font-size: 13px; }
      .categoria-editor { font-size: 12px; padding: 7px 5px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="encabezado">
      <img class="logo" src="images/logo-nuevo.jpg" alt="Distribuidora L&amp;P">
      <div>
        <h1>Catálogo de productos</h1>
        <div class="subtitulo">Distribuidora L&amp;P</div>
      </div>
      <button id="adminButton" class="admin-button" type="button">Administrar catálogo</button>
    </div>
  </header>

  <main>
    <div id="adminPanel">
      <strong>Modo administración</strong>
      <span class="admin-help">Selecciona la categoría o arrastra una imagen directamente sobre la tarjeta del producto.</span>
      <button id="salirAdmin" type="button">Salir</button>
      <div id="mensajeAdmin"></div>
    </div>

    <div class="barra">
      <input id="buscar" type="search" placeholder="Buscar por nombre, código o descripción">
      <div id="estado">Cargando productos...</div>
    </div>
    <div id="categorias" aria-label="Categorías"></div>
    <section id="productos" aria-live="polite"></section>
    <div id="paginacion"></div>
  </main>

  <div id="visor" aria-label="Vista ampliada">
    <img id="imagenGrande" alt="">
  </div>

  <div id="loginModal" role="dialog" aria-modal="true" aria-labelledby="tituloLogin">
    <div class="login-card">
      <button id="cerrarLogin" type="button" aria-label="Cerrar">×</button>
      <h2 id="tituloLogin">Administrar catálogo</h2>
      <p>Escribe la contraseña autorizada para organizar productos y asignar imágenes.</p>
      <form id="loginForm">
        <input id="adminPassword" type="password" autocomplete="current-password" placeholder="Contraseña">
        <button id="entrarAdmin" type="submit">Entrar</button>
      </form>
      <div id="loginError"></div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      var PER_PAGE = 24;
      var CATEGORIAS_BASE = [
        'Abarrotes', 'Bebidas', 'Sabritas', 'Galletas', 'Dulces', 'Otros',
        'Sin categoría'
      ];
      var estado = {
        productos: [],
        categoria: 'Todos',
        pagina: 1,
        categorias: [],
        maestroCategorias: [],
        admin: false,
        imagenes: {},
        categoriasPersistentes: {}
      };

      var $ = function (selector) { return document.querySelector(selector); };

      function normalizar(valor) {
        return String(valor || '')
          .toLowerCase()
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/[^a-z0-9]+/g, ' ')
          .trim();
      }

      function sinPrefijo(valor) {
        return String(valor || '').replace(/^[^:]+:\s*/, '').trim();
      }

      function claveImagen(valor) {
        return normalizar(valor).replace(/\s+/g, '-');
      }

      function leerJson(url, respaldo) {
        return fetch(url, { cache: 'no-store' })
          .then(function (respuesta) {
            if (!respuesta.ok) throw new Error('No se pudo cargar ' + url);
            return respuesta.json();
          })
          .catch(function () { return respaldo; });
      }

      function mapaDirecto(valor) {
        if (valor && valor.imagenes) return valor.imagenes;
        if (valor && valor.categorias) return valor.categorias;
        return valor || {};
      }

      function mapaCatalogoDesdeMaestro(maestro, imagenes) {
        var mapa = {};
        var mapaImagenes = mapaDirecto(imagenes);

        (maestro.productos || []).forEach(function (entrada) {
          var imagenPersistente = mapaImagenes[entrada.productoQuickBooksPrincipal];
          if (imagenPersistente) entrada.imagen = imagenPersistente;

          function agregar(clave) {
            if (!clave) return;
            mapa[normalizar(clave)] = entrada;
            mapa[normalizar(sinPrefijo(clave))] = entrada;
          }

          agregar(entrada.productoQuickBooksPrincipal);
          (entrada.productosQuickBooksEquivalentes || []).forEach(agregar);
        });
        return mapa;
      }

      function buscarEntrada(mapa, nombre, sku) {
        return mapa[normalizar(nombre)] ||
          mapa[normalizar(sinPrefijo(nombre))] ||
          mapa[normalizar(sku)] ||
          null;
      }

      function construirProducto(item, mapa, categoriasPersistentes, imagenesPersistentes) {
        var id = item.Id || item.id || '';
        var nombreQbo = item.Name || item.nombre || item.FullyQualifiedName || 'Producto';
        var sku = item.Sku || item.sku || '';
        var entrada = buscarEntrada(mapa, nombreQbo, sku);
        var mapaCategorias = mapaDirecto(categoriasPersistentes);
        var mapaImagenes = mapaDirecto(imagenesPersistentes);
        var nombre = item.nombreVisible ||
          (entrada && entrada.nombreVisible ? entrada.nombreVisible : nombreQbo);
        var imagen = item.imagen ||
          mapaImagenes[String(id)] ||
          mapaImagenes[nombreQbo] ||
          mapaImagenes[sku] ||
          (entrada && entrada.imagen) ||
          '';
        var categoria = item.categoria ||
          mapaCategorias[String(id)] ||
          (entrada && entrada.categoria) ||
          'Sin categoría';
        var precio = Number(
          item.UnitPrice == null
            ? (item.precio == null ? 0 : item.precio)
            : item.UnitPrice
        );

        if (!imagen) imagen = 'images/productos/' + claveImagen(nombreQbo) + '.jpg';

        return {
          id: id,
          nombre: nombre,
          descripcion: item.Description || item.descripcion || '',
          sku: sku,
          precio: Number.isFinite(precio) ? precio : 0,
          categoria: categoria,
          imagen: imagen
        };
      }

      function mostrarMensajeAdmin(mensaje, error) {
        var elemento = $('#mensajeAdmin');
        elemento.textContent = mensaje || '';
        elemento.style.color = error ? '#b3261e' : '#1c6b3c';
      }

      function cargarCategorias() {
        var mapaCategorias = mapaDirecto(estado.categoriasPersistentes);
        var categorias = ['Todos'];
        var disponibles = (estado.maestroCategorias || []).concat(
          Object.keys(mapaCategorias).map(function (id) { return mapaCategorias[id]; })
        );

        CATEGORIAS_BASE.concat(disponibles).forEach(function (categoria) {
          if (categoria && categorias.indexOf(categoria) === -1) categorias.push(categoria);
        });

        estado.categorias = categorias;
        var contenedor = $('#categorias');
        contenedor.innerHTML = '';

        categorias.forEach(function (categoria) {
          var boton = document.createElement('button');
          boton.type = 'button';
          boton.className = 'categoria' +
            (categoria === estado.categoria ? ' activa' : '');
          boton.textContent = categoria;
          boton.addEventListener('click', function () {
            estado.categoria = categoria;
            estado.pagina = 1;
            cargarCategorias();
            mostrarProductos();
          });
          contenedor.appendChild(boton);
        });
      }

      function productosFiltrados() {
        var busqueda = normalizar($('#buscar').value);
        return estado.productos.filter(function (producto) {
          var coincideCategoria = estado.categoria === 'Todos' ||
            producto.categoria === estado.categoria;
          var texto = normalizar(
            producto.nombre + ' ' + producto.descripcion + ' ' + producto.sku
          );
          return coincideCategoria &&
            (!busqueda || texto.indexOf(busqueda) !== -1);
        });
      }

      function guardarCategoria(producto, categoria, selector) {
        selector.disabled = true;
        fetch('/catalogo-admin/productos/' + encodeURIComponent(producto.id) + '/categoria', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ categoria: categoria })
        })
          .then(function (respuesta) {
            return respuesta.json().then(function (datos) {
              if (!respuesta.ok) throw new Error(datos.error || 'No se pudo guardar');
              return datos;
            });
          })
          .then(function (datos) {
            producto.categoria = datos.categoria;
            estado.categoriasPersistentes[String(producto.id)] = datos.categoria;
            mostrarMensajeAdmin('Categoría guardada correctamente.');
            cargarCategorias();
            mostrarProductos();
          })
          .catch(function (error) {
            selector.value = producto.categoria;
            selector.disabled = false;
            mostrarMensajeAdmin(error.message, true);
          });
      }

      function guardarImagen(producto, archivo, imagen, tarjeta) {
        if (!archivo || !archivo.type || archivo.type.indexOf('image/') !== 0) {
          mostrarMensajeAdmin('Selecciona un archivo de imagen válido.', true);
          return;
        }

        var datos = new FormData();
        datos.append('imagen', archivo);
        tarjeta.classList.remove('arrastrando');
        mostrarMensajeAdmin('Guardando imagen...');

        fetch('/catalogo-admin/productos/' + encodeURIComponent(producto.id) + '/imagen', {
          method: 'POST',
          body: datos
        })
          .then(function (respuesta) {
            return respuesta.json().then(function (resultado) {
              if (!respuesta.ok) throw new Error(resultado.error || 'No se pudo guardar');
              return resultado;
            });
          })
          .then(function (resultado) {
            producto.imagen = resultado.imagen + '?actualizada=' + Date.now();
            imagen.src = producto.imagen;
            estado.imagenes[resultado.clave || String(producto.id)] = resultado.imagen;
            mostrarMensajeAdmin('Imagen guardada correctamente.');
          })
          .catch(function (error) {
            mostrarMensajeAdmin(error.message, true);
          });
      }

      function prepararEdicion(tarjeta, producto, imagen) {
        if (!estado.admin) return;

        tarjeta.classList.add('admin-editable');
        tarjeta.addEventListener('dragover', function (evento) {
          evento.preventDefault();
          tarjeta.classList.add('arrastrando');
        });
        tarjeta.addEventListener('dragleave', function () {
          tarjeta.classList.remove('arrastrando');
        });
        tarjeta.addEventListener('drop', function (evento) {
          evento.preventDefault();
          var archivo = evento.dataTransfer && evento.dataTransfer.files &&
            evento.dataTransfer.files[0];
          guardarImagen(producto, archivo, imagen, tarjeta);
        });

        var selector = document.createElement('select');
        selector.className = 'categoria-editor';
        estado.categorias.filter(function (categoria) {
          return categoria !== 'Todos';
        }).forEach(function (categoria) {
          var opcion = document.createElement('option');
          opcion.value = categoria;
          opcion.textContent = categoria;
          selector.appendChild(opcion);
        });
        selector.value = producto.categoria;
        selector.addEventListener('click', function (evento) {
          evento.stopPropagation();
        });
        selector.addEventListener('change', function () {
          guardarCategoria(producto, selector.value, selector);
        });

        var entrada = document.createElement('input');
        entrada.type = 'file';
        entrada.accept = 'image/*';
        entrada.hidden = true;
        entrada.addEventListener('change', function () {
          guardarImagen(producto, entrada.files[0], imagen, tarjeta);
          entrada.value = '';
        });

        imagen.addEventListener('click', function (evento) {
          evento.stopPropagation();
          entrada.click();
        });

        var pista = document.createElement('div');
        pista.className = 'admin-hint';
        pista.textContent = 'Arrastra una imagen aquí o haz clic en la imagen';
        tarjeta.appendChild(selector);
        tarjeta.appendChild(pista);
        tarjeta.appendChild(entrada);
      }

      function mostrarProductos() {
        var contenedor = $('#productos');
        var lista = productosFiltrados();
        var totalPaginas = Math.max(1, Math.ceil(lista.length / PER_PAGE));
        if (estado.pagina > totalPaginas) estado.pagina = totalPaginas;

        var inicio = (estado.pagina - 1) * PER_PAGE;
        var visibles = lista.slice(inicio, inicio + PER_PAGE);
        contenedor.innerHTML = '';

        if (!visibles.length) {
          var vacio = document.createElement('div');
          vacio.className = 'vacio';
          vacio.textContent = 'No encontramos productos con esa búsqueda.';
          contenedor.appendChild(vacio);
        } else {
          visibles.forEach(function (producto) {
            var tarjeta = document.createElement('article');
            tarjeta.className = 'producto';

            var imagen = document.createElement('img');
            imagen.src = producto.imagen;
            imagen.alt = producto.nombre;
            imagen.loading = 'lazy';
            imagen.addEventListener('error', function () {
              if (imagen.src.indexOf('logo-nuevo.jpg') === -1) {
                imagen.src = 'images/logo-nuevo.jpg';
              }
            });

            if (!estado.admin) {
              imagen.addEventListener('click', function () {
                $('#imagenGrande').src = producto.imagen;
                $('#imagenGrande').alt = producto.nombre;
                $('#visor').classList.add('abierto');
              });
            }

            var titulo = document.createElement('h2');
            titulo.textContent = producto.nombre;

            var precio = document.createElement('div');
            precio.className = 'precio';
            precio.textContent = '$' + producto.precio.toFixed(2);

            var categoria = document.createElement('div');
            categoria.className = 'categoria-producto';
            categoria.textContent = producto.categoria;

            tarjeta.appendChild(imagen);
            tarjeta.appendChild(titulo);
            tarjeta.appendChild(precio);
            tarjeta.appendChild(categoria);
            prepararEdicion(tarjeta, producto, imagen);
            contenedor.appendChild(tarjeta);
          });
        }

        $('#estado').textContent = lista.length + ' producto' +
          (lista.length === 1 ? '' : 's');
        mostrarPaginacion(totalPaginas);
      }

      function mostrarPaginacion(totalPaginas) {
        var contenedor = $('#paginacion');
        contenedor.innerHTML = '';
        if (totalPaginas <= 1) return;

        var anterior = document.createElement('button');
        anterior.type = 'button';
        anterior.textContent = 'Anterior';
        anterior.disabled = estado.pagina <= 1;
        anterior.addEventListener('click', function () {
          estado.pagina -= 1;
          mostrarProductos();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        var pagina = document.createElement('span');
        pagina.textContent = 'Página ' + estado.pagina + ' de ' + totalPaginas;

        var siguiente = document.createElement('button');
        siguiente.type = 'button';
        siguiente.textContent = 'Siguiente';
        siguiente.disabled = estado.pagina >= totalPaginas;
        siguiente.addEventListener('click', function () {
          estado.pagina += 1;
          mostrarProductos();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        contenedor.appendChild(anterior);
        contenedor.appendChild(pagina);
        contenedor.appendChild(siguiente);
      }

      function cargarCatalogo() {
        var imagenesUrl = estado.admin ? '/catalogo-admin/imagenes' : null;
        var categoriasUrl = estado.admin ? '/catalogo-admin/categorias' : null;

        return Promise.all([
          leerJson('/catalogo-publico', { productos: [] }),
          leerJson('/catalogo_maestro_sistema.json', { productos: [], categorias: [] }),
          imagenesUrl ? leerJson(imagenesUrl, {}) : Promise.resolve({}),
          categoriasUrl ? leerJson(categoriasUrl, {}) : Promise.resolve({})
        ]).then(function (respuestas) {
          var datosQbo = respuestas[0];
          var maestro = respuestas[1];
          estado.imagenes = respuestas[2] || {};
          estado.categoriasPersistentes = respuestas[3] || {};
          var mapa = mapaCatalogoDesdeMaestro(maestro, estado.imagenes);

          estado.maestroCategorias = (maestro.categorias || []).concat(CATEGORIAS_BASE);
          estado.productos = (datosQbo.productos || [])
            .map(function (item) {
              return construirProducto(
                item,
                mapa,
                estado.categoriasPersistentes,
                estado.imagenes
              );
            })
            .filter(function (producto) { return producto.nombre; });

          cargarCategorias();
          mostrarProductos();
        }).catch(function () {
          $('#estado').textContent = 'No se pudo cargar el catálogo.';
          $('#productos').innerHTML =
            '<div class="vacio">Intenta actualizar la página en unos segundos.</div>';
        });
      }

      function actualizarInterfazAdmin() {
        $('#adminPanel').classList.toggle('visible', estado.admin);
        $('#adminButton').style.display = estado.admin ? 'none' : '';
        mostrarMensajeAdmin('');
      }

      function abrirLogin() {
        $('#loginError').textContent = '';
        $('#adminPassword').value = '';
        $('#loginModal').classList.add('abierto');
        window.setTimeout(function () { $('#adminPassword').focus(); }, 50);
      }

      function cerrarLogin() {
        $('#loginModal').classList.remove('abierto');
      }

      function activarAdmin() {
        estado.admin = true;
        cerrarLogin();
        actualizarInterfazAdmin();
        cargarCatalogo();
      }

      $('#buscar').addEventListener('input', function () {
        estado.pagina = 1;
        mostrarProductos();
      });

      $('#visor').addEventListener('click', function () {
        $('#visor').classList.remove('abierto');
      });

      $('#adminButton').addEventListener('click', abrirLogin);
      $('#cerrarLogin').addEventListener('click', cerrarLogin);
      $('#loginModal').addEventListener('click', function (evento) {
        if (evento.target === $('#loginModal')) cerrarLogin();
      });

      $('#loginForm').addEventListener('submit', function (evento) {
        evento.preventDefault();
        $('#loginError').textContent = 'Comprobando...';
        fetch('/catalogo-admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contrasena: $('#adminPassword').value })
        })
          .then(function (respuesta) {
            return respuesta.json().then(function (datos) {
              if (!respuesta.ok) throw new Error(datos.error || 'No se pudo iniciar sesión');
              return datos;
            });
          })
          .then(function () { activarAdmin(); })
          .catch(function (error) { $('#loginError').textContent = error.message; });
      });

      $('#salirAdmin').addEventListener('click', function () {
        fetch('/catalogo-admin/logout', { method: 'POST' })
          .finally(function () {
            estado.admin = false;
            actualizarInterfazAdmin();
            cargarCatalogo();
          });
      });

      fetch('/catalogo-admin/session', { cache: 'no-store' })
        .then(function (respuesta) {
          return respuesta.ok ? respuesta.json() : { autenticado: false };
        })
        .then(function (sesion) {
          estado.admin = !!sesion.autenticado;
          actualizarInterfazAdmin();
          cargarCatalogo();
        })
        .catch(function () { cargarCatalogo(); });

      window.setInterval(cargarCatalogo, 60000);
    }());
  </script>
</body>
</html>
