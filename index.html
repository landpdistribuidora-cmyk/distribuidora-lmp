<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DISTRIBUIDORA L&P</title>
  <style>
    :root{--blue:#0b63f6;--blue2:#084ec4;--bg:#f3f7fc;--card:#fff;--text:#111827;--muted:#6b7280;--line:#dbe4f0;--green:#16a34a;--red:#dc2626;--dark:#111827;--shadow:0 10px 30px rgba(15,23,42,.10)}
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
    .app-header{background:linear-gradient(135deg,var(--blue),var(--blue2));padding:18px 20px;color:#fff}.header-inner{max-width:1280px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}.logo{max-width:260px;width:55vw;max-height:90px;object-fit:contain}.admin{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.admin button{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;padding:10px 12px;border-radius:12px}.container{max-width:1280px;margin:auto;padding:18px}.panel{background:var(--card);border-radius:22px;padding:18px;box-shadow:var(--shadow);margin-bottom:18px}.top-grid{display:grid;grid-template-columns:1.2fr 1.2fr 180px;gap:14px;align-items:end}label{font-size:14px;font-weight:800;color:#374151;display:block;margin-bottom:7px}input,select{width:100%;border:1px solid var(--line);border-radius:14px;padding:14px;font-size:17px;background:#fff}.qty-wrap{display:flex;gap:8px}.qty-wrap button,.main-btn,button{border:0;border-radius:14px;padding:13px 16px;font-weight:800;cursor:pointer;font-size:16px}.qty-wrap button{background:#eaf2ff;color:var(--blue);min-width:48px}.voice-row{display:grid;grid-template-columns:1fr 190px;gap:12px;margin-top:14px;align-items:center}.voice-box{border:1px solid var(--line);border-radius:16px;padding:13px;background:#f8fbff;color:#374151;font-weight:700;min-height:52px}.voice-btn{background:var(--green);color:#fff;border-radius:18px;font-size:18px}.status{margin-top:10px;color:var(--muted);font-size:14px;white-space:pre-wrap}.layout{display:grid;grid-template-columns:1fr 380px;gap:18px}.catbar{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 16px}.catbar button{background:#fff;color:var(--blue);border:2px solid #cfe0ff;padding:10px 14px}.catbar button.activo{background:var(--blue);color:#fff;border-color:var(--blue)}.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}.product{background:#fff;border:1px solid var(--line);border-radius:20px;padding:12px;text-align:center;box-shadow:0 4px 14px rgba(15,23,42,.07);cursor:pointer;min-height:210px;display:flex;flex-direction:column;justify-content:space-between}.product:hover{transform:translateY(-2px)}.product img{height:105px;width:100%;object-fit:contain}.product h3{font-size:15px;line-height:1.2;margin:8px 0 5px}.price{font-size:19px;font-weight:900;color:var(--blue)}.pedido{position:sticky;top:14px}.pedido-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.badge{background:#eaf2ff;color:var(--blue);font-weight:900;border-radius:999px;padding:7px 10px}.pedido-list{max-height:55vh;overflow:auto;padding-right:4px}.item{background:#f8fafc;border-left:5px solid var(--blue);border-radius:14px;padding:10px;margin-bottom:10px}.item-row{display:flex;justify-content:space-between;gap:8px}.item strong{font-size:15px}.item small{color:var(--muted)}.item-controls{display:flex;gap:6px;margin-top:8px}.item-controls button{padding:7px 11px;border-radius:10px;background:#e5eefc;color:#0b4bb3}.total{font-size:34px;font-weight:900;color:var(--blue);text-align:center;background:#eaf2ff;border-radius:18px;padding:16px;margin:14px 0}.invoice-btn{width:100%;background:var(--green);color:#fff;font-size:18px;margin-bottom:8px}.new-btn{width:100%;background:#1f2937;color:#fff}.danger{background:var(--red)!important;color:#fff!important}@media(max-width:900px){.top-grid,.layout,.voice-row{grid-template-columns:1fr}.pedido{position:relative;top:0}.container{padding:12px}.header-inner{display:block;text-align:center}.admin{justify-content:center;margin-top:10px}.products-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}}
  </style>
</head>
<body>
<header class="app-header"><div class="header-inner"><img src="images/logo-nuevo.jpg" alt="Distribuidora L&P" class="logo"><div class="admin"><button onclick="window.open('/connect-qbo','_blank')">Conectar QB</button><button onclick="cargarDatos()">Recargar</button></div></div></header>
<main class="container">
<section class="panel"><div class="top-grid"><div><label>Cliente</label><input id="buscarCliente" placeholder="Escribe o di el cliente..." oninput="filtrarClientesPorTexto()"><select id="cliente" onchange="actualizarClienteSeleccionado()"><option value="">Cargando clientes...</option></select></div><div><label>Artículo</label><input id="buscarProducto" placeholder="Buscar artículo..." oninput="mostrarProductos()"></div><div><label>Cantidad</label><div class="qty-wrap"><button onclick="cambiarCantidad(-1)">−</button><input id="cantidadProducto" type="number" min="1" value="1" style="text-align:center"><button onclick="cambiarCantidad(1)">+</button></div></div></div><div class="voice-row"><div id="mensaje" class="voice-box">Listo para trabajar. Ejemplo: “cliente Mr Mu, agregar dos Chetos Flaming, total”.</div><button id="btnVoz" class="voice-btn" onclick="toggleVoz()">🎤 Escuchar</button></div><div id="clienteInfo" class="status">Cliente seleccionado: ninguno</div></section>
<section class="layout"><div class="panel"><div class="catbar"><button onclick="filtrarCategoria('Todos')" id="cat-Todos" class="activo">Todos</button><button onclick="filtrarCategoria('Abarrotes')" id="cat-Abarrotes">Abarrotes</button><button onclick="filtrarCategoria('Sabritas')" id="cat-Sabritas">Sabritas</button><button onclick="filtrarCategoria('Galletas')" id="cat-Galletas">Galletas</button><button onclick="filtrarCategoria('Dulces')" id="cat-Dulces">Dulces</button></div><div id="productos" class="products-grid"></div></div><aside class="panel pedido"><div class="pedido-head"><h2 style="margin:0">Pedido</h2><span id="contador" class="badge">0</span></div><div id="pedido" class="pedido-list"></div><div class="total" id="total">Total: $0.00</div><button class="invoice-btn" onclick="crearFactura()">Crear factura</button><button class="new-btn" onclick="nuevoPedido()">Nuevo pedido</button></aside></section>
</main>
<script>
let productos=[],clientes=[],clientesFiltrados=[],pedido=[],categoriaActual="Todos",productoSeleccionadoVoz=null,reconocimiento=null,vozActiva=false,reinicioVozTimer=null;
const categorias={Todos:[],Abarrotes:["aceite","salsa","mayonesa","knorr","frijol","arroz","harina","atun","atún","enlatado","flete"],Sabritas:["sabritas","doritos","cheetos","chet","ruffles","paquetaxo","paquetazo","sabriton","crujitos","chips","flamin","flaming"],Galletas:["galleta","galletas","gamesa","oreo","emperador","florentina","marías","marias"],Dulces:["dulce","dulces","paleta","chicle","chocolate","caramelo","gomita","mazapan","mazapán"]};
async function cargarDatos(){try{mostrarMensaje("Cargando clientes y artículos...");const cr=await fetch("/clientes"),dc=await cr.json();if(!cr.ok)throw new Error(dc.detalle||dc.error||"Error clientes");clientes=(dc.clientes||dc.QueryResponse?.Customer||[]).map(c=>({id:c.id||c.Id,nombre:c.nombre||c.DisplayName||c.FullyQualifiedName||c.CompanyName||"Cliente sin nombre",email:c.email||c.PrimaryEmailAddr?.Address||"",raw:c.raw||c}));clientesFiltrados=clientes;llenarSelectClientes(clientes);const pr=await fetch("/productos"),dp=await pr.json();if(!pr.ok)throw new Error(dp.detalle||dp.error||"Error artículos");productos=(dp.productos||dp.QueryResponse?.Item||[]).map(p=>({id:p.id||p.Id,Id:p.id||p.Id,Name:p.nombre||p.Name||p.FullyQualifiedName||"Artículo sin nombre",FullyQualifiedName:p.nombre||p.Name||p.FullyQualifiedName||"Artículo sin nombre",Description:p.descripcion||p.Description||p.PurchaseDesc||p.SalesDescription||"",UnitPrice:Number(p.precio??p.UnitPrice??0),Sku:p.sku||p.Sku||p.SKU||"",raw:p.raw||p}));mostrarProductos();mostrarPedido();actualizarClienteSeleccionado();mostrarMensaje(`Listo. Clientes: ${clientes.length}. Artículos: ${productos.length}.`)}catch(e){console.error(e);mostrarMensaje("Error cargando datos. Revisa QuickBooks o reconecta.\n"+e.message)}}
function mostrarMensaje(t){document.getElementById("mensaje").innerText=t}function normalizar(t){return String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim()}function hablar(t){try{if(!("speechSynthesis"in window))return;const v=new SpeechSynthesisUtterance(t);v.lang="es-MX";window.speechSynthesis.cancel();window.speechSynthesis.speak(v)}catch(e){}}
function llenarSelectClientes(lista){const s=document.getElementById("cliente");s.innerHTML="";if(!lista.length){s.innerHTML='<option value="">No hay clientes</option>';return}lista.slice(0,80).forEach(c=>{const o=document.createElement("option");o.value=c.id;o.textContent=c.email?`${c.nombre} - ${c.email}`:c.nombre;s.appendChild(o)})}function obtenerClienteSeleccionado(){const id=document.getElementById("cliente").value;return clientes.find(c=>String(c.id)===String(id))||null}function actualizarClienteSeleccionado(){const c=obtenerClienteSeleccionado();document.getElementById("clienteInfo").innerText=c?`Cliente seleccionado: ${c.nombre}${c.email?" | "+c.email:" | sin correo"}`:"Cliente seleccionado: ninguno"}function filtrarClientesPorTexto(){const q=normalizar(document.getElementById("buscarCliente").value);clientesFiltrados=q?clientes.filter(c=>normalizar(c.nombre+" "+c.email).includes(q)):clientes;llenarSelectClientes(clientesFiltrados);actualizarClienteSeleccionado()}
function scoreTexto(base,q){base=normalizar(base);q=normalizar(q);if(!q)return 0;if(base===q)return 1000;if(base.includes(q))return 700;let s=0;q.split(" ").filter(Boolean).forEach(t=>{if(base.includes(t))s+=120});return s}function seleccionarClientePorTexto(texto){const q=normalizar(texto.replace(/^cliente\s+|^tienda\s+/g,""));const ord=clientes.map(c=>({c,s:scoreTexto(c.nombre+" "+c.email,q)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);if(!ord.length){mostrarMensaje("No encontré cliente: "+texto);hablar("No encontré ese cliente");return null}const c=ord[0].c;document.getElementById("buscarCliente").value=c.nombre;llenarSelectClientes([c]);document.getElementById("cliente").value=c.id;actualizarClienteSeleccionado();mostrarMensaje("Cliente seleccionado: "+c.nombre);hablar("Cliente "+c.nombre);return c}
function obtenerNombreProducto(p){return p.Name||p.FullyQualifiedName||"Artículo sin nombre"}function obtenerPrecioProducto(p){return Number(p.UnitPrice||0)}function obtenerDescripcionProducto(p){return p.Description||p.PurchaseDesc||p.SalesDescription||obtenerNombreProducto(p)}function limpiarNombreArchivo(n){return normalizar(n).replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")}function obtenerImagenProducto(p){return `images/productos/${limpiarNombreArchivo(obtenerNombreProducto(p))}.jpg`}function productoEnCategoria(p,c){if(c==="Todos")return true;const txt=normalizar(obtenerNombreProducto(p)+" "+obtenerDescripcionProducto(p));return categorias[c].some(w=>txt.includes(normalizar(w)))}
function mostrarProductos(){const div=document.getElementById("productos"),q=normalizar(document.getElementById("buscarProducto").value);div.innerHTML="";const lista=productos.filter(p=>{const txt=normalizar(obtenerNombreProducto(p)+" "+obtenerDescripcionProducto(p)+" "+(p.Sku||""));return(!q||txt.includes(q)||scoreProducto(p,q)>0)&&productoEnCategoria(p,categoriaActual)}).slice(0,120);if(lista.length===1)productoSeleccionadoVoz=lista[0];if(!lista.length){div.innerHTML="<p>No se encontraron artículos.</p>";return}lista.forEach(p=>{const card=document.createElement("div");card.className="product";card.id="producto-"+p.Id;const n=obtenerNombreProducto(p);card.innerHTML=`<img src="${obtenerImagenProducto(p)}" alt="${n}" onerror="this.onerror=null; this.src='images/logo-nuevo.jpg';"><h3>${n}</h3><div class="price">$${obtenerPrecioProducto(p).toFixed(2)}</div>`;card.onclick=()=>agregarProducto(p,Number(document.getElementById("cantidadProducto").value||1));div.appendChild(card)})}
function filtrarCategoria(c){categoriaActual=c;document.querySelectorAll(".catbar button").forEach(b=>b.classList.remove("activo"));const btn=document.getElementById("cat-"+c);if(btn)btn.classList.add("activo");mostrarProductos()}function cambiarCantidad(n){const i=document.getElementById("cantidadProducto");i.value=Math.max(1,Number(i.value||1)+n)}function agregarProducto(producto,cantidad=1){cantidad=Number(cantidad||1);if(!Number.isFinite(cantidad)||cantidad<=0)cantidad=1;const id=String(producto.Id||producto.id),nombre=obtenerNombreProducto(producto),precio=obtenerPrecioProducto(producto),descripcion=obtenerDescripcionProducto(producto),existe=pedido.find(x=>x.id===id);if(existe)existe.cantidad+=cantidad;else pedido.push({id,itemId:id,nombre,name:nombre,precio,unitPrice:precio,descripcion,description:descripcion,cantidad,qty:cantidad});productoSeleccionadoVoz=producto;document.getElementById("buscarProducto").value="";document.getElementById("cantidadProducto").value=1;mostrarProductos();mostrarPedido();mostrarMensaje(`Agregado: ${cantidad} × ${nombre}`)}
function mostrarPedido(){const div=document.getElementById("pedido");div.innerHTML="";let total=0,cant=0;pedido.forEach(item=>{item.qty=item.cantidad;item.unitPrice=item.precio;const sub=item.precio*item.cantidad;total+=sub;cant+=item.cantidad;div.innerHTML+=`<div class="item"><div class="item-row"><strong>${item.nombre}</strong><b>$${sub.toFixed(2)}</b></div><small>Cantidad: ${item.cantidad} | Precio: $${item.precio.toFixed(2)}</small><div class="item-controls"><button onclick="restarProducto('${item.id}')">−</button><button onclick="sumarProducto('${item.id}')">+</button><button class="danger" onclick="eliminarProducto('${item.id}')">X</button></div></div>`});document.getElementById("total").innerText="Total: $"+total.toFixed(2);document.getElementById("contador").innerText=cant+" artículos"}function sumarProducto(id){const i=pedido.find(p=>p.id===id);if(i)i.cantidad++;mostrarPedido()}function restarProducto(id){const i=pedido.find(p=>p.id===id);if(i){i.cantidad--;if(i.cantidad<=0)pedido=pedido.filter(p=>p.id!==id)}mostrarPedido()}function eliminarProducto(id){pedido=pedido.filter(p=>p.id!==id);mostrarPedido()}function vaciarPedido(){pedido=[];mostrarPedido();mostrarMensaje("Pedido vacío.")}function nuevoPedido(){pedido=[];productoSeleccionadoVoz=null;document.getElementById("buscarProducto").value="";document.getElementById("cantidadProducto").value=1;mostrarProductos();mostrarPedido();mostrarMensaje("Nuevo pedido")}
function palabrasClave(texto){const ig=new Set(["buscar","busca","producto","articulo","artículo","cliente","tienda","agregar","agrega","pon","dame","de","del","la","el","los","las","un","una","unos","unas","pieza","piezas","caja","cajas","paquete","paquetes","bolsa","bolsas"]);return normalizar(texto).split(" ").filter(p=>p&&!ig.has(p))}function scoreProducto(producto,texto){const q=normalizar(texto),tokens=palabrasClave(q);if(!tokens.length)return 0;const nombre=normalizar(obtenerNombreProducto(producto)),desc=normalizar(obtenerDescripcionProducto(producto)),sku=normalizar(producto.Sku||""),comb=`${nombre} ${desc} ${sku}`;let s=0;if(nombre===q)s+=1000;if(nombre.includes(q))s+=700;if(desc.includes(q))s+=350;if(sku&&sku.includes(q))s+=500;tokens.forEach(t=>{if(nombre.includes(t))s+=140;if(desc.includes(t))s+=90;if(sku.includes(t))s+=120});return s}function encontrarProductosInteligente(texto){return productos.map(p=>({p,s:scoreProducto(p,texto)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).map(x=>x.p)}
function buscarProductoPorVoz(texto,autoAgregar=false){let limpio=normalizar(texto).replace(/^buscar\s+/,"").replace(/^busca\s+/,"").replace(/^producto\s+/,"").replace(/^articulo\s+/,"").replace(/^artículo\s+/,"").replace(/^agregar\s+/,"").replace(/^agrega\s+/,"").replace(/^pon\s+/,"");const partes=convertirNumero(limpio),cantidad=partes.cantidad,busqueda=partes.textoRestante||limpio,encontrados=encontrarProductosInteligente(busqueda);productoSeleccionadoVoz=encontrados[0]||null;document.getElementById("buscarProducto").value=busqueda;mostrarProductos();if(!productoSeleccionadoVoz){mostrarMensaje("No encontré artículo: "+busqueda);hablar("No encontré el artículo");return}if(autoAgregar){agregarProducto(productoSeleccionadoVoz,cantidad);hablar("Agregado "+cantidad);return}mostrarMensaje("Encontré: "+obtenerNombreProducto(productoSeleccionadoVoz));hablar("Encontré "+obtenerNombreProducto(productoSeleccionadoVoz))}
function crearReconocedor(callback,continuous=false){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert("Usa Chrome o Edge para voz.");return null}const rec=new SR();rec.lang="es-MX";rec.continuous=continuous;rec.interimResults=false;rec.maxAlternatives=1;rec.onresult=e=>{const texto=e.results[e.results.length-1][0].transcript.toLowerCase().trim();callback(texto)};rec.onerror=e=>console.log("ERROR VOZ:",e.error);rec.onend=()=>{if(vozActiva){clearTimeout(reinicioVozTimer);reinicioVozTimer=setTimeout(()=>{try{reconocimiento.start()}catch(e){}},650)}};return rec}function toggleVoz(){if(vozActiva)desactivarModoVoz();else activarModoVoz()}function activarModoVoz(){if(reconocimiento){try{reconocimiento.stop()}catch(e){}}vozActiva=true;document.getElementById("btnVoz").innerText="🛑 Detener";reconocimiento=crearReconocedor(procesarComandoVoz,true);if(reconocimiento){hablar("Escuchando");setTimeout(()=>{try{reconocimiento.start()}catch(e){}},500)}}function desactivarModoVoz(){vozActiva=false;clearTimeout(reinicioVozTimer);document.getElementById("btnVoz").innerText="🎤 Escuchar";if(reconocimiento){try{reconocimiento.stop()}catch(e){}}reconocimiento=null}
function procesarComandoVoz(texto){const limpio=normalizar(texto);mostrarMensaje("Voz: "+texto);if(!limpio)return;const partesFrase=limpio.split(/\s*,\s*|\s+y luego\s+|\s+despues\s+|\s+después\s+/).map(x=>x.trim()).filter(Boolean);if(partesFrase.length>1){partesFrase.forEach(p=>procesarComandoVoz(p));return}if(limpio.includes("apagar voz")||limpio==="apagar"){desactivarModoVoz();return}if(limpio.includes("crear factura")||limpio.includes("enviar factura")){crearFactura();return}if(limpio==="total"||limpio.includes("cuanto es")||limpio.includes("cuanto llevo")){const total=pedido.reduce((s,p)=>s+p.precio*p.cantidad,0);hablar("El total es "+total.toFixed(2)+" dólares");mostrarMensaje("Total: $"+total.toFixed(2));return}if(limpio.includes("vaciar")){vaciarPedido();return}if(limpio.includes("nuevo pedido")){nuevoPedido();return}if(limpio.startsWith("cliente ")||limpio.startsWith("tienda ")){seleccionarClientePorTexto(limpio);document.getElementById("buscarProducto").value="";return}if(limpio.startsWith("producto ")||limpio.startsWith("articulo ")||limpio.startsWith("artículo ")||limpio.startsWith("buscar ")||limpio.startsWith("busca ")){buscarProductoPorVoz(limpio,false);return}if(limpio.startsWith("agregar ")||limpio.startsWith("agrega ")||limpio.startsWith("pon ")){buscarProductoPorVoz(limpio,true);return}const partes=convertirNumero(limpio);if(partes.textoRestante&&partes.textoRestante!==limpio){buscarProductoPorVoz(limpio,true);return}const cliente=!obtenerClienteSeleccionado()?seleccionarClientePorTexto(limpio):null;if(cliente)return;buscarProductoPorVoz(limpio,false)}
function convertirNumero(texto){texto=normalizar(texto);const mapa={uno:1,una:1,un:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,dieciseis:16,diecisiete:17,dieciocho:18,diecinueve:19,veinte:20,veintiuno:21,veintidos:22,veintitres:23,veinticuatro:24,veinticinco:25,treinta:30,cuarenta:40,cincuenta:50,sesenta:60,setenta:70,ochenta:80,noventa:90,cien:100};const tokens=texto.split(" ").filter(Boolean);let cantidad=1,usados=0;if(tokens[0]&&/^\d+$/.test(tokens[0])){cantidad=parseInt(tokens[0],10);usados=1}else if(tokens[0]&&mapa[tokens[0]]){cantidad=mapa[tokens[0]];usados=1;if(tokens[1]==="y"&&tokens[2]&&mapa[tokens[2]]){cantidad+=mapa[tokens[2]];usados=3}}return{cantidad:Number.isFinite(cantidad)&&cantidad>0?cantidad:1,textoRestante:tokens.slice(usados).join(" ").trim()}}
async function crearFactura(){const cliente=obtenerClienteSeleccionado();if(!cliente){alert("Selecciona un cliente.");return}if(!pedido.length){alert("Agrega artículos al pedido.");return}if(!confirm("¿Crear factura en QuickBooks?"))return;try{mostrarMensaje("Creando factura...");const res=await fetch("/crear-factura",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({customerId:cliente.id,customerName:cliente.nombre,customerEmail:cliente.email,sendEmail:true,items:pedido.map(p=>({itemId:p.id,id:p.id,name:p.nombre,description:p.descripcion,qty:p.cantidad,unitPrice:p.precio,amount:Number((p.precio*p.cantidad).toFixed(2))}))})});const data=await res.json();if(!res.ok){console.log(data);alert("Error creando factura: "+(data.detalle||data.error||"revisa Railway"));return}const inv=data.invoice||data.quickbooks?.Invoice||{};alert("Factura creada correctamente"+(inv.DocNumber||inv.Id?": "+(inv.DocNumber||inv.Id):""));pedido=[];mostrarPedido()}catch(e){console.error(e);alert("Error creando factura: "+e.message)}}
cargarDatos();
</script>
</body>
</html>
