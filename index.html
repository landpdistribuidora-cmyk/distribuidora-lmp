<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DISTRIBUIDORA L&P</title>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#eef4fb;color:#111827}
    .header{background:linear-gradient(135deg,#007bff,#0056d6);text-align:center;padding:20px}.header img{max-width:330px;width:80%}
    .container{padding:20px}.panel,.productos-box,.pedido-box{background:#fff;border-radius:18px;padding:18px;box-shadow:0 4px 14px #00000014;margin-bottom:18px}
    .toolbar{display:grid;grid-template-columns:190px 1fr 1fr 180px;gap:14px;align-items:end}.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
    label{font-weight:700} select,input{width:100%;padding:12px;border:1px solid #ccc;border-radius:11px;font-size:16px;margin-top:7px}
    button,.image-button{border:0;border-radius:11px;padding:12px 18px;font-size:16px;font-weight:700;cursor:pointer;background:#0666ff;color:#fff}
    .dark{background:#1f2937}.green{background:#16a34a}.purple{background:#7c3aed}.yellow{background:#f59e0b;color:#111827}
    .layout{display:grid;grid-template-columns:2fr 1fr;gap:22px}.categorias{display:flex;gap:8px;flex-wrap:wrap}.categorias button{background:#fff;color:#1d4ed8;border:2px solid #1d4ed8}.categorias button.activo{background:#1d4ed8;color:#fff}
    .productos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px;margin-top:18px}.producto{border:1px solid #ddd;border-radius:16px;padding:14px;text-align:center;cursor:pointer;box-shadow:0 3px 10px #00000014;transition:.15s;background:#fff}.producto:hover{transform:scale(1.02)}.producto.arrastrando{border:3px dashed #16a34a;background:#ecfdf5}.producto img{width:125px;height:105px;object-fit:contain}.producto h3{font-size:17px;margin:9px 0}.producto p{font-size:18px;color:#1d4ed8;font-weight:700}.image-button{display:block;margin-top:10px}
    .pedido-box{position:sticky;top:15px;height:max-content}.pedido-header{display:flex;justify-content:space-between;align-items:center}.contador{background:#1d4ed8;color:#fff;border-radius:14px;padding:7px 11px;font-weight:700}.pedido-item{border-left:5px solid #1d4ed8;background:#f8fafc;border-radius:11px;padding:10px;margin-bottom:10px}.pedido-controles button{padding:7px 11px;margin:4px}.total{font-size:30px;color:#1d4ed8;font-weight:700;text-align:center;background:#eaf2ff;padding:16px;border-radius:16px;margin:16px 0}
    .mensaje,.voz{display:none;padding:11px;border-radius:11px;margin-top:10px;font-weight:700}.mensaje{background:#eaf2ff;color:#1d4ed8}.voz{background:#dcfce7;color:#166534}.cliente-info{background:#f8fafc;border-left:5px solid #16a34a;padding:10px;border-radius:11px;margin-top:12px;white-space:pre-line}
    @media(max-width:900px){.toolbar,.layout{grid-template-columns:1fr}.pedido-box{position:relative}.container{padding:10px}.actions button{width:100%}}
  </style>
</head>
<body>
  <div class="header"><img src="images/logo-nuevo.jpg" alt="Distribuidora L&P"></div>
  <div class="container">
    <div class="panel">
      <div class="actions"><button class="purple" onclick="window.open('/connect-qbo','_blank')">Conectar QuickBooks</button><button class="dark" onclick="cargarDatos()">Recargar datos</button></div>
      <div class="toolbar">
        <div><label>Tipo de usuario</label><select id="tipoUsuario"><option value="empleado">Empleado</option><option value="cliente">Cliente</option></select></div>
        <div><label>Cliente / Tienda</label><input id="buscarCliente" placeholder="Buscar cliente..." oninput="filtrarClientes()"><select id="cliente" onchange="actualizarCliente()"></select></div>
        <div><label>Buscar artículo</label><input id="buscarProducto" placeholder="Buscar artículo..." oninput="mostrarProductos()"></div>
        <div><label>Cantidad</label><input id="cantidadProducto" type="number" min="1" value="1"></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 180px;gap:12px;margin-top:12px"><input id="notaPedido" placeholder="Nuevo pedido"><button id="btnVoz" class="green" onclick="toggleVoz()">🎤 Escuchar</button></div>
      <div id="clienteInfo" class="cliente-info">Cliente seleccionado: ninguno</div><div id="mensaje" class="mensaje"></div><div id="vozEstado" class="voz">🎤 Escuchando</div>
    </div>
    <div class="layout">
      <div class="productos-box"><h2>Artículos</h2><div class="categorias" id="categorias"></div><div id="productos" class="productos-grid"></div></div>
      <div class="pedido-box"><div class="pedido-header"><h2>🛒 Pedido</h2><span id="contador" class="contador">0 productos</span></div><div id="pedido"></div><div id="total" class="total">Total: $0.00</div><button onclick="crearFactura()">Crear factura</button><button class="dark" onclick="vaciarPedido()">Vaciar pedido</button><button class="dark" onclick="nuevoPedido()">Nuevo pedido</button></div>
    </div>
  </div>
<script>
let productos=[],clientes=[],pedido=[],categoriaActual='Todos',reconocimiento=null,vozActiva=false,reinicioVozTimer=null,aliases={};
const categorias={Todos:[],Abarrotes:['aceite','salsa','mayonesa','knorr','frijol','arroz','harina','atun','enlatado','flete'],Sabritas:['sabritas','doritos','cheetos','ruffles','paquetaxo','sabriton','crujitos','chips'],Galletas:['galleta','gamesa','oreo','emperador','florentina','marias'],Dulces:['dulce','paleta','chicle','chocolate','caramelo','gomita','mazapan']};
function normalizar(t){return String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}
function limpiarNombreArchivo(t){return normalizar(t).replace(/\s+/g,'-')}
function mostrarMensaje(t){const e=document.getElementById('mensaje');e.textContent=t;e.style.display='block';clearTimeout(e.timer);e.timer=setTimeout(()=>e.style.display='none',3500)}
function claveProducto(p){return p.catalogo?.productoQuickBooksPrincipal||p.Sku||p.Name||p.Id}
function nombreProducto(p){return p.catalogo?.nombreVisible||p.Name||p.FullyQualifiedName||'Producto sin nombre'}
function precioProducto(p){return Number(p.UnitPrice||0)}
function descripcionProducto(p){return p.Description||nombreProducto(p)}
function imagenProducto(p){if(p.imagenTemporal)return p.imagenTemporal;if(p.imagen)return p.imagen;if(p.catalogo?.imagen)return p.catalogo.imagen;return `images/productos/${limpiarNombreArchivo(claveProducto(p))}.jpg`}
async function cargarImagenesPersistentes(){try{const r=await fetch('/api/imagenes-productos',{cache:'no-store'});if(r.ok)return await r.json()}catch(e){console.error('No se pudo cargar el mapa de imágenes:',e)}return{}}
async function cargarDatos(){try{mostrarMensaje('Cargando datos...');try{aliases=await (await fetch('/aliases.json')).json()}catch{aliases={}}const cat=await (await fetch('/catalogo_maestro_sistema.json',{cache:'no-store'})).json();const imagenesPersistentes=await cargarImagenesPersistentes();const mapa={};(cat.productos||[]).forEach(i=>{const imagenPersistente=imagenesPersistentes[i.productoQuickBooksPrincipal];if(imagenPersistente)i.imagen=imagenPersistente;[i.productoQuickBooksPrincipal,...(i.productosQuickBooksEquivalentes||[])].filter(Boolean).forEach(c=>mapa[normalizar(c)]=i)});const cr=await fetch('/clientes');const cd=await cr.json();if(!cr.ok)throw new Error(cd.error||'Error clientes');clientes=(cd.clientes||cd.QueryResponse?.Customer||[]).map(c=>({id:c.id||c.Id,nombre:c.nombre||c.DisplayName||c.FullyQualifiedName||'Cliente',email:c.email||c.PrimaryEmailAddr?.Address||''}));llenarClientes(clientes);const pr=await fetch('/productos');const pd=await pr.json();if(!pr.ok)throw new Error(pd.error||'Error productos');productos=(pd.productos||pd.QueryResponse?.Item||[]).map(p=>({id:p.id||p.Id,Id:p.id||p.Id,Name:p.nombre||p.Name||p.FullyQualifiedName||'Producto',FullyQualifiedName:p.nombre||p.Name||p.FullyQualifiedName||'Producto',Description:p.descripcion||p.Description||'',UnitPrice:Number(p.precio??p.UnitPrice??0),Sku:p.sku||p.Sku||p.SKU||'',catalogo:mapa[normalizar(p.nombre||p.Name||p.FullyQualifiedName)]||mapa[normalizar(p.sku||p.Sku||p.SKU)]||null}));crearCategorias();mostrarProductos();mostrarPedido();actualizarCliente();mostrarMensaje(`Listo. ${clientes.length} clientes y ${productos.length} productos.`)}catch(e){console.error(e);mostrarMensaje('Error: '+e.message)}}
function crearCategorias(){const c=document.getElementById('categorias');c.innerHTML='';Object.keys(categorias).forEach(n=>{const b=document.createElement('button');b.textContent=n;b.className=n===categoriaActual?'activo':'';b.onclick=()=>{categoriaActual=n;crearCategorias();mostrarProductos()};c.appendChild(b)})}
function llenarClientes(lista){const s=document.getElementById('cliente');s.innerHTML='';lista.slice(0,100).forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.email?`${c.nombre} - ${c.email}`:c.nombre;s.appendChild(o)})}
function filtrarClientes(){const q=normalizar(document.getElementById('buscarCliente').value);llenarClientes(!q?clientes:clientes.filter(c=>normalizar(c.nombre+' '+c.email).includes(q)));actualizarCliente()}
function clienteSeleccionado(){return clientes.find(c=>String(c.id)===String(document.getElementById('cliente').value))||null}
function actualizarCliente(){const c=clienteSeleccionado();document.getElementById('clienteInfo').textContent=c?`Cliente seleccionado: ${c.nombre}\nCorreo: ${c.email||'SIN CORREO'}`:'Cliente seleccionado: ninguno'}
function enCategoria(p){if(categoriaActual==='Todos')return true;const n=normalizar(nombreProducto(p));return categorias[categoriaActual].some(x=>n.includes(normalizar(x)))}
async function guardarImagenProducto(clave,origen){const archivo=origen instanceof File?origen:origen?.files?.[0];if(!archivo)return;if(!archivo.type.startsWith('image/'))return alert('Selecciona una imagen válida.');const datos=new FormData();datos.append('imagen',archivo);try{mostrarMensaje('Guardando imagen...');const r=await fetch(`/api/productos/${encodeURIComponent(clave)}/imagen`,{method:'POST',body:datos});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'No se pudo guardar la imagen');const p=productos.find(x=>String(claveProducto(x))===String(clave)||String(x.Id)===String(clave));if(p){const ruta=d.imagen||'';p.imagen=ruta;p.imagenTemporal=ruta+(ruta.includes('?')?'&':'?')+'v='+Date.now();if(p.catalogo)p.catalogo.imagen=ruta}mostrarProductos();mostrarMensaje('Imagen guardada correctamente.')}catch(e){console.error(e);alert(e.message)}}
function mostrarProductos(){const cont=document.getElementById('productos'),q=normalizar(document.getElementById('buscarProducto').value);cont.innerHTML='';const lista=productos.filter(p=>(!q||normalizar(nombreProducto(p)+' '+descripcionProducto(p)+' '+p.Sku).includes(q))&&enCategoria(p));if(!lista.length){cont.innerHTML='<p>No se encontraron productos.</p>';return}lista.forEach(p=>{const card=document.createElement('div');card.className='producto';const clave=claveProducto(p);card.innerHTML=`<img src="${imagenProducto(p)}" alt="${nombreProducto(p)}" onerror="this.onerror=null;this.src='images/logo-nuevo.jpg'"><h3>${nombreProducto(p)}</h3><p>$${precioProducto(p).toFixed(2)}</p>`;card.onclick=()=>agregarProducto(p,Number(document.getElementById('cantidadProducto').value||1));card.ondragover=e=>{e.preventDefault();e.stopPropagation();card.classList.add('arrastrando')};card.ondragleave=e=>{e.preventDefault();card.classList.remove('arrastrando')};card.ondrop=e=>{e.preventDefault();e.stopPropagation();card.classList.remove('arrastrando');const f=e.dataTransfer?.files?.[0];if(f)guardarImagenProducto(clave,f)};cont.appendChild(card)})}
function agregarProducto(p,c=1){c=Math.max(1,Number(c)||1);const id=String(p.Id||p.id),exist=pedido.find(x=>x.id===id);if(exist)exist.cantidad+=c;else pedido.push({id,itemId:id,nombre:nombreProducto(p),descripcion:descripcionProducto(p),precio:precioProducto(p),cantidad:c});document.getElementById('cantidadProducto').value=1;mostrarPedido();mostrarMensaje(`Producto agregado: ${c} x ${nombreProducto(p)}`);hablar(`Agregado ${c} de ${nombreProducto(p)}`)}
function mostrarPedido(){const d=document.getElementById('pedido');d.innerHTML='';let total=0,cant=0;pedido.forEach(i=>{const sub=i.precio*i.cantidad;total+=sub;cant+=i.cantidad;d.innerHTML+=`<div class="pedido-item"><strong>${i.nombre}</strong><br>Cantidad: ${i.cantidad}<br>Subtotal: $${sub.toFixed(2)}<div class="pedido-controles"><button onclick="cambiarPedido('${i.id}',-1)">-</button><button onclick="cambiarPedido('${i.id}',1)">+</button><button onclick="eliminarProducto('${i.id}')">X</button></div></div>`});document.getElementById('total').textContent='Total: $'+total.toFixed(2);document.getElementById('contador').textContent=cant+' productos'}
function cambiarPedido(id,d){const i=pedido.find(x=>x.id===id);if(i){i.cantidad+=d;if(i.cantidad<=0)pedido=pedido.filter(x=>x.id!==id)}mostrarPedido()}function eliminarProducto(id){pedido=pedido.filter(x=>x.id!==id);mostrarPedido()}function vaciarPedido(){pedido=[];mostrarPedido();hablar('Pedido vacío.')}function nuevoPedido(){pedido=[];document.getElementById('buscarProducto').value='';mostrarPedido();mostrarProductos();hablar('Nuevo pedido.')}
async function crearFactura(){const c=clienteSeleccionado();if(!c)return alert('Selecciona un cliente.');if(!pedido.length)return alert('Agrega productos al pedido.');if(document.getElementById('tipoUsuario').value==='cliente'){const r=await fetch('/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customerId:c.id,customerName:c.nombre,items:pedido})});if(!r.ok)return alert('Error guardando pedido.');alert('Pedido enviado para aprobación.');pedido=[];mostrarPedido();return}if(!confirm('¿Crear factura en QuickBooks?'))return;try{const r=await fetch('/crear-factura',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customerId:c.id,customerName:c.nombre,customerEmail:c.email,sendEmail:true,items:pedido.map(i=>({itemId:i.id,id:i.id,name:i.nombre,description:i.descripcion,qty:i.cantidad,unitPrice:i.precio,amount:Number((i.precio*i.cantidad).toFixed(2))}))})});const d=await r.json();if(!r.ok)throw new Error(d.detalle||d.error||'Error creando factura');alert('Factura creada correctamente.');pedido=[];mostrarPedido()}catch(e){alert(e.message)}}
function hablar(t){if(!vozActiva)return;try{const u=new SpeechSynthesisUtterance(t);u.lang='es-MX';u.rate=1;crypto;window.speechSynthesis.cancel();window.speechSynthesis.speak(u)}catch{}}
function toggleVoz(){vozActiva?desactivarVoz():activarVoz()}function activarVoz(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert('Usa Chrome o Edge para la voz.');vozActiva=true;reconocimiento=new SR();reconocimiento.lang='es-MX';reconocimiento.continuous=true;reconocimiento.interimResults=false;reconocimiento.onresult=e=>procesarVoz(e.results[e.results.length-1][0].transcript);reconocimiento.onend=()=>{if(vozActiva)reinicioVozTimer=setTimeout(()=>{try{reconocimiento.start()}catch{}},700)};document.getElementById('vozEstado').style.display='block';document.getElementById('btnVoz').textContent='🎤 Escuchando';hablar('Modo voz activado.');setTimeout(()=>{try{reconocimiento.start()}catch{}},500)}function desactivarVoz(){vozActiva=false;clearTimeout(reinicioVozTimer);try{reconocimiento?.stop()}catch{}document.getElementById('vozEstado').style.display='none';document.getElementById('btnVoz').textContent='🎤 Escuchar'}
function procesarVoz(t){const q=normalizar(t);mostrarMensaje('Voz: '+t);if(q.includes('apagar voz'))return desactivarVoz();if(q.includes('vaciar'))return vaciarPedido();if(q.includes('nuevo pedido'))return nuevoPedido();if(q.includes('crear factura'))return crearFactura();if(q.includes('total')){const total=pedido.reduce((s,i)=>s+i.precio*i.cantidad,0);return hablar('El total es '+total.toFixed(2)+' dólares.')}const m=q.match(/^(\d+)\s+(.+)$/);const cant=m?Number(m[1]):1,bus=m?m[2]:q;const p=productos.find(x=>normalizar(nombreProducto(x)+' '+descripcionProducto(x)).includes(bus));if(p)return agregarProducto(p,cant);hablar('No encontré el producto.')}
cargarDatos();
</script>
</body>
</html>
