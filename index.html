<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DISTRIBUIDORA L&P</title>

  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #eef4fb; color: #111827; }
    .header { background: linear-gradient(135deg, #007bff, #0056d6); text-align: center; padding: 25px; }
    .header img { max-width: 330px; width: 80%; }
    .container { padding: 25px; }
    .top-panel, .productos-box, .pedido-box { background: white; border-radius: 18px; padding: 20px; box-shadow: 0 4px 14px rgba(0,0,0,0.08); margin-bottom: 20px; }
    label { font-weight: bold; font-size: 18px; }
    select, input { padding: 13px; border-radius: 12px; border: 1px solid #ccc; font-size: 16px; margin-top: 8px; margin-bottom: 18px; min-width: 230px; max-width: 100%; box-sizing: border-box; }
    button { border: none; border-radius: 12px; padding: 13px 20px; font-size: 16px; font-weight: bold; cursor: pointer; background: #0066ff; color: white; margin: 5px; }
    .btn-dark { background: #1f2937; }
    .btn-red { background: #dc2626; }
    .btn-green { background: #16a34a; }
    .btn-purple { background: #7c3aed; }
    .btn-yellow { background: #f59e0b; color: #111827; }
    .layout { display: grid; grid-template-columns: 2fr 1fr; gap: 25px; }
    .categorias button { background: white; color: #1d4ed8; border: 2px solid #1d4ed8; }
    .categorias button.activo { background: #1d4ed8; color: white; }
    .productos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 20px; margin-top: 20px; }
    .producto { background: white; border: 1px solid #ddd; border-radius: 18px; padding: 15px; text-align: center; cursor: pointer; box-shadow: 0 3px 10px rgba(0,0,0,0.08); transition: 0.15s ease; }
    .producto:hover { transform: scale(1.03); }
    .producto img { width: 115px; height: 95px; object-fit: contain; }
    .producto h3 { margin: 10px 0 5px; font-size: 17px; }
    .producto p { color: #1d4ed8; font-weight: bold; font-size: 18px; }
    .pedido-box { position: sticky; top: 20px; height: fit-content; }
    .pedido-header { display: flex; justify-content: space-between; align-items: center; }
    .contador { background: #1d4ed8; color: white; border-radius: 15px; padding: 7px 12px; font-weight: bold; }
    .pedido-item { border-left: 5px solid #1d4ed8; padding: 10px; margin-bottom: 12px; background: #f8fafc; border-radius: 12px; }
    .pedido-controles button { padding: 8px 13px; border-radius: 10px; }
    .total { font-size: 32px; color: #1d4ed8; font-weight: bold; text-align: center; background: #eaf2ff; padding: 18px; border-radius: 18px; margin: 20px 0; }
    .mensaje { background: #eaf2ff; color: #1d4ed8; padding: 12px; border-radius: 12px; margin-top: 10px; font-weight: bold; display: none; white-space: pre-wrap; }
    .voz-activa { background: #dcfce7; color: #166534; padding: 12px; border-radius: 12px; margin-top: 10px; font-weight: bold; display: none; }
    .cliente-info { background: #f8fafc; border-left: 5px solid #16a34a; padding: 10px; border-radius: 12px; margin: 5px 0 18px; }
    .small { font-size: 14px; color: #4b5563; }
    @media(max-width: 900px) {
      .container { padding: 12px; }
      .layout { grid-template-columns: 1fr; }
      .pedido-box { position: relative; top: 0; }
      button { width: 100%; margin: 5px 0; }
      select, input { width: 100%; }
    }
  </style>
</head>

<body>
  <div class="header">
    <img src="images/logo-nuevo.jpg" alt="Distribuidora L&P" class="logo">
  </div>

  <div class="container">
    <div class="top-panel">
      <button class="btn-purple" onclick="window.open('/connect-qbo', '_blank')">Conectar QuickBooks</button>
      <button class="btn-dark" onclick="cargarDatos()">Recargar datos</button>

      <br><br>

      <label>Tipo de usuario</label><br>
      <select id="tipoUsuario">
        <option value="empleado">Empleado</option>
        <option value="cliente">Cliente</option>
      </select>

      <br>

      <label>Cliente / Tienda</label><br>
      <input id="buscarCliente" type="text" placeholder="Buscar cliente por nombre..." oninput="filtrarClientesPorTexto()">
      <button class="btn-green" onclick="escucharCliente()">🎤 Decir cliente</button>
      <select id="cliente" onchange="actualizarClienteSeleccionado()">
        <option value="">Cargando clientes...</option>
      </select>
      <div id="clienteInfo" class="cliente-info">Cliente seleccionado: ninguno</div>

      <label>Buscar producto</label><br>
      <input id="buscarProducto" type="text" placeholder="Buscar producto..." oninput="mostrarProductos()">
      <button class="btn-green" onclick="escucharProducto()">🎤 Decir producto</button>
      <button class="btn-yellow" onclick="escucharCantidad()">🎤 Decir cantidad</button>
      <input id="cantidadProducto" type="number" min="1" value="1" style="width:120px; min-width:120px;">

      <br>
      <button onclick="limpiarBusqueda()">Limpiar producto</button>
      <button class="btn-green" onclick="activarModoVoz()">🎤 Activar modo voz completo</button>
      <button class="btn-dark" onclick="desactivarModoVoz()">Apagar voz</button>

      <div id="mensaje" class="mensaje"></div>
      <div id="vozEstado" class="voz-activa">🎤 Modo voz activo. Puedes decir: cliente La Esperanza, buscar Coca, agregar 5, total, crear factura.</div>
    </div>

    <div class="layout">
      <div class="productos-box">
        <h2>Productos</h2>

        <div class="categorias">
          <button onclick="filtrarCategoria('Todos')" id="cat-Todos" class="activo">Todos</button>
          <button onclick="filtrarCategoria('Abarrotes')" id="cat-Abarrotes">Abarrotes</button>
          <button onclick="filtrarCategoria('Sabritas')" id="cat-Sabritas">Sabritas</button>
          <button onclick="filtrarCategoria('Galletas')" id="cat-Galletas">Galletas</button>
          <button onclick="filtrarCategoria('Dulces')" id="cat-Dulces">Dulces</button>
        </div>

        <div id="productos" class="productos-grid"></div>
      </div>

      <div class="pedido-box">
        <div class="pedido-header">
          <h2>🛒 Pedido</h2>
          <span id="contador" class="contador">0 productos</span>
        </div>

        <div id="pedido"></div>
        <div class="total" id="total">Total: $0.00</div>

        <button onclick="crearFactura()">Crear factura</button>
        <button class="btn-dark" onclick="vaciarPedido()">Vaciar pedido</button>
        <button class="btn-dark" onclick="nuevoPedido()">Nuevo pedido</button>
        <p class="small">Al crear factura, el sistema intenta enviar copia al correo del cliente y al correo del jefe configurado en .env.</p>
      </div>
    </div>
  </div>

  <script>
    let productos = [];
    let clientes = [];
    let clientesFiltrados = [];
    let pedido = [];
    let categoriaActual = "Todos";
    let productoSeleccionadoVoz = null;
    let reconocimiento = null;
    let barcodes = [];

    const categorias = {
      Todos: [],
      Abarrotes: ["aceite", "salsa", "mayonesa", "knorr", "frijol", "arroz", "harina", "atun", "atún", "enlatado", "flete"],
      Sabritas: ["sabritas", "doritos", "cheetos", "ruffles", "paquetaxo", "paquetazo", "sabriton", "crujitos", "chips"],
      Galletas: ["galleta", "galletas", "gamesa", "oreo", "emperador", "florentina", "marías", "marias"],
      Dulces: ["dulce", "dulces", "paleta", "chicle", "chocolate", "caramelo", "gomita", "mazapan", "mazapán"]
    };

    async function cargarDatos() {
      try {
        mostrarMensaje("Cargando clientes y productos desde QuickBooks...");

        const clientesRes = await fetch("/clientes");
        const dataClientes = await clientesRes.json();
        if (!clientesRes.ok) throw new Error(dataClientes.detalle || dataClientes.error || "Error cargando clientes");

        clientes = dataClientes.clientes || dataClientes.QueryResponse?.Customer || [];
        clientes = clientes.map(c => ({
          id: c.id || c.Id,
          nombre: c.nombre || c.DisplayName || c.FullyQualifiedName || c.CompanyName || "Cliente sin nombre",
          email: c.email || c.PrimaryEmailAddr?.Address || "",
          raw: c.raw || c
        }));
        clientesFiltrados = clientes;
        llenarSelectClientes(clientes);

        const productosRes = await fetch("/productos");
        const dataProductos = await productosRes.json();
        if (!productosRes.ok) throw new Error(dataProductos.detalle || dataProductos.error || "Error cargando productos");

        productos = dataProductos.productos || dataProductos.QueryResponse?.Item || [];
        productos = productos.map(p => ({
          id: p.id || p.Id,
          Id: p.id || p.Id,
          Name: p.nombre || p.Name || p.FullyQualifiedName || "Producto sin nombre",
          FullyQualifiedName: p.nombre || p.Name || p.FullyQualifiedName || "Producto sin nombre",
          Description: p.descripcion || p.Description || "",
          UnitPrice: Number(p.precio ?? p.UnitPrice ?? 0),
          Sku: p.sku || p.Sku || p.SKU || "",
          raw: p.raw || p
        }));

        try {
          const barcodesRes = await fetch("/barcodes");
          barcodes = await barcodesRes.json();
        } catch (e) {
          barcodes = [];
        }

        mostrarProductos();
        mostrarPedido();
        actualizarClienteSeleccionado();
        mostrarMensaje(`Listo. Clientes: ${clientes.length}. Productos: ${productos.length}.`);
      } catch (error) {
        console.log("ERROR CARGANDO DATOS:", error);
        mostrarMensaje("Error cargando clientes o productos. Revisa QuickBooks o reconecta en /connect-qbo\n" + error.message);
      }
    }

    function llenarSelectClientes(lista) {
      const clienteSelect = document.getElementById("cliente");
      clienteSelect.innerHTML = "";

      if (!lista.length) {
        clienteSelect.innerHTML = `<option value="">No hay clientes</option>`;
        return;
      }

      lista.forEach(c => {
        const option = document.createElement("option");
        option.value = c.id;
        option.textContent = c.email ? `${c.nombre} - ${c.email}` : c.nombre;
        option.dataset.nombre = c.nombre;
        option.dataset.email = c.email || "";
        clienteSelect.appendChild(option);
      });
    }

    function obtenerClienteSeleccionado() {
      const clienteId = document.getElementById("cliente").value;
      return clientes.find(c => String(c.id) === String(clienteId)) || null;
    }

    function actualizarClienteSeleccionado() {
      const cliente = obtenerClienteSeleccionado();
      const info = document.getElementById("clienteInfo");
      if (!cliente) {
        info.innerText = "Cliente seleccionado: ninguno";
        return;
      }
      info.innerText = `Cliente seleccionado: ${cliente.nombre}\nCorreo cliente: ${cliente.email || "NO TIENE CORREO EN QUICKBOOKS"}`;
    }

    function normalizar(texto) {
      return String(texto || "")
        .toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function filtrarClientesPorTexto() {
      const texto = normalizar(document.getElementById("buscarCliente").value);
      if (!texto) {
        clientesFiltrados = clientes;
      } else {
        clientesFiltrados = clientes.filter(c => normalizar(`${c.nombre} ${c.email}`).includes(texto));
      }
      llenarSelectClientes(clientesFiltrados.slice(0, 50));
      actualizarClienteSeleccionado();
    }

    function seleccionarClientePorTexto(texto) {
      const limpio = normalizar(texto.replace(/^cliente\s+/, "").replace(/^tienda\s+/, ""));
      const encontrado = clientes.find(c => normalizar(c.nombre).includes(limpio));

      if (!encontrado) {
        document.getElementById("buscarCliente").value = texto;
        filtrarClientesPorTexto();
        hablar("No encontré ese cliente. Revisa la lista.");
        return null;
      }

      document.getElementById("buscarCliente").value = encontrado.nombre;
      llenarSelectClientes([encontrado]);
      document.getElementById("cliente").value = encontrado.id;
      actualizarClienteSeleccionado();
      hablar("Cliente seleccionado: " + encontrado.nombre);
      return encontrado;
    }

    function obtenerNombreProducto(p) {
      return p.Name || p.FullyQualifiedName || "Producto sin nombre";
    }

    function obtenerPrecioProducto(p) {
      return Number(p.UnitPrice || 0);
    }

    function obtenerDescripcionProducto(p) {
      return p.Description || p.PurchaseDesc || p.SalesDescription || obtenerNombreProducto(p);
    }

    function limpiarNombreArchivo(nombre) {
      return String(nombre || "")
        .toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
    }

    function obtenerImagenProducto(p) {
      const nombre = limpiarNombreArchivo(obtenerNombreProducto(p));
      return `images/productos/${nombre}.jpg`;
    }

    function mostrarMensaje(texto) {
      const mensaje = document.getElementById("mensaje");
      mensaje.innerText = texto;
      mensaje.style.display = "block";
      clearTimeout(mensaje.timer);
      mensaje.timer = setTimeout(() => { mensaje.style.display = "none"; }, 4500);
    }

    function hablar(texto) {
      try {
        if (!("speechSynthesis" in window)) return;
        const voz = new SpeechSynthesisUtterance(texto);
        voz.lang = "es-MX";
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(voz);
      } catch (e) {}
    }

    function productoEnCategoria(p, categoria) {
      if (categoria === "Todos") return true;
      const nombre = obtenerNombreProducto(p).toLowerCase();
      return categorias[categoria].some(palabra => nombre.includes(palabra));
    }

    function mostrarProductos() {
      const divProductos = document.getElementById("productos");
      const buscar = normalizar(document.getElementById("buscarProducto").value);
      divProductos.innerHTML = "";

      const filtrados = productos.filter(p => {
        const nombre = normalizar(obtenerNombreProducto(p));
        const descripcion = normalizar(obtenerDescripcionProducto(p));
        const sku = normalizar(p.Sku || p.SKU || p.sku || "");
        const coincideBusqueda = !buscar || nombre.includes(buscar) || descripcion.includes(buscar) || sku.includes(buscar);
        const coincideCategoria = productoEnCategoria(p, categoriaActual);
        return coincideBusqueda && coincideCategoria;
      });

      if (filtrados.length === 1) productoSeleccionadoVoz = filtrados[0];

      if (filtrados.length === 0) {
        divProductos.innerHTML = `<p>No se encontraron productos.</p>`;
        productoSeleccionadoVoz = null;
        return;
      }

      filtrados.slice(0, 100).forEach(p => {
        const nombre = obtenerNombreProducto(p);
        const precio = obtenerPrecioProducto(p);
        const imagen = obtenerImagenProducto(p);
        const card = document.createElement("div");
        card.className = "producto";
        card.id = "producto-" + p.Id;
        card.innerHTML = `
          <img src="${imagen}" alt="${nombre}" onerror="this.onerror=null; this.src='images/logo-nuevo.jpg';">
          <h3>${nombre}</h3>
          <p>$${precio.toFixed(2)}</p>
        `;
        card.onclick = () => agregarProducto(p, Number(document.getElementById("cantidadProducto").value || 1));
        divProductos.appendChild(card);
      });
    }

    function agregarProducto(producto, cantidad = 1) {
      cantidad = Number(cantidad || 1);
      if (!Number.isFinite(cantidad) || cantidad <= 0) cantidad = 1;

      const id = String(producto.Id || producto.id);
      const nombre = obtenerNombreProducto(producto);
      const precio = obtenerPrecioProducto(producto);
      const descripcion = obtenerDescripcionProducto(producto);
      const existente = pedido.find(p => p.id === id);

      if (existente) existente.cantidad += cantidad;
      else pedido.push({ id, itemId: id, nombre, name: nombre, precio, unitPrice: precio, descripcion, cantidad, qty: cantidad });

      productoSeleccionadoVoz = producto;
      document.getElementById("cantidadProducto").value = 1;
      mostrarPedido();
      mostrarMensaje("Producto agregado: " + cantidad + " x " + nombre);
      hablar("Agregado " + cantidad + " de " + nombre);
    }

    function mostrarPedido() {
      const divPedido = document.getElementById("pedido");
      const totalDiv = document.getElementById("total");
      const contador = document.getElementById("contador");
      divPedido.innerHTML = "";

      let total = 0;
      let cantidadTotal = 0;

      pedido.forEach(item => {
        item.qty = item.cantidad;
        item.unitPrice = item.precio;
        const subtotal = Number(item.precio || 0) * Number(item.cantidad || 0);
        total += subtotal;
        cantidadTotal += item.cantidad;

        divPedido.innerHTML += `
          <div class="pedido-item">
            <strong>${item.nombre}</strong><br>
            Cantidad: ${item.cantidad}<br>
            Subtotal: $${subtotal.toFixed(2)}
            <div class="pedido-controles">
              <button onclick="restarProducto('${item.id}')">-</button>
              <button onclick="sumarProducto('${item.id}')">+</button>
              <button onclick="eliminarProducto('${item.id}')">X</button>
            </div>
          </div>
        `;
      });

      totalDiv.innerText = "Total: $" + total.toFixed(2);
      contador.innerText = cantidadTotal + " productos";
    }

    function sumarProducto(id) {
      const item = pedido.find(p => p.id === id);
      if (item) item.cantidad++;
      mostrarPedido();
    }

    function restarProducto(id) {
      const item = pedido.find(p => p.id === id);
      if (item) {
        item.cantidad--;
        if (item.cantidad <= 0) pedido = pedido.filter(p => p.id !== id);
      }
      mostrarPedido();
    }

    function eliminarProducto(id) {
      pedido = pedido.filter(p => p.id !== id);
      mostrarPedido();
    }

    function vaciarPedido() {
      pedido = [];
      mostrarPedido();
      hablar("Pedido vacío.");
    }

    function nuevoPedido() {
      pedido = [];
      document.getElementById("buscarProducto").value = "";
      document.getElementById("buscarCliente").value = "";
      productoSeleccionadoVoz = null;
      clientesFiltrados = clientes;
      llenarSelectClientes(clientes);
      actualizarClienteSeleccionado();
      mostrarPedido();
      mostrarProductos();
      hablar("Nuevo pedido.");
    }

    function limpiarBusqueda() {
      document.getElementById("buscarProducto").value = "";
      productoSeleccionadoVoz = null;
      mostrarProductos();
    }

    function filtrarCategoria(categoria) {
      categoriaActual = categoria;
      document.querySelectorAll(".categorias button").forEach(btn => btn.classList.remove("activo"));
      const boton = document.getElementById("cat-" + categoria);
      if (boton) boton.classList.add("activo");
      mostrarProductos();
    }

    async function crearFactura() {
      const tipoUsuario = document.getElementById("tipoUsuario").value;
      const cliente = obtenerClienteSeleccionado();

      if (!cliente) {
        alert("Selecciona un cliente.");
        hablar("Selecciona un cliente.");
        return;
      }

      if (pedido.length === 0) {
        alert("Agrega productos al pedido.");
        hablar("Agrega productos al pedido.");
        return;
      }

      if (tipoUsuario === "cliente") {
        await guardarPedidoPendiente(cliente.id, cliente.nombre);
        return;
      }

      if (!confirm("¿Crear factura en QuickBooks y enviar copia al cliente y al jefe?")) return;

      try {
        mostrarMensaje("Creando factura y enviando correos...");

        const res = await fetch("/crear-factura", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            customerId: cliente.id,
            customerName: cliente.nombre,
            customerEmail: cliente.email,
            sendEmail: true,
            items: pedido.map(p => ({
              itemId: p.id,
              id: p.id,
              name: p.nombre,
              description: p.descripcion,
              qty: p.cantidad,
              unitPrice: p.precio,
              amount: Number((p.precio * p.cantidad).toFixed(2))
            }))
          })
        });

        const data = await res.json();
        if (!res.ok) {
          console.log(data);
          alert("Error creando factura: " + (data.detalle || data.error || "revisa consola"));
          return;
        }

        const invoice = data.invoice?.Invoice || data.Invoice || {};
        let msg = "Factura creada correctamente.";
        if (invoice.DocNumber || invoice.Id) msg += " Factura: " + (invoice.DocNumber || invoice.Id) + ".";

        if (data.emailResult?.sent) msg += " Correos enviados.";
        else msg += " La factura se creó, pero el correo no se envió: " + (data.emailResult?.reason || "revisa .env");

        alert(msg);
        hablar(msg);
        pedido = [];
        mostrarPedido();
      } catch (error) {
        console.log("ERROR CREANDO FACTURA:", error);
        alert("Error creando factura: " + error.message);
      }
    }

    async function guardarPedidoPendiente(clienteId, clienteNombre) {
      try {
        const res = await fetch("/orders", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ customerId: clienteId, customerName: clienteNombre, items: pedido })
        });
        if (!res.ok) {
          alert("Error guardando pedido.");
          return;
        }
        alert("Pedido enviado para aprobación.");
        hablar("Pedido enviado para aprobación.");
        pedido = [];
        mostrarPedido();
      } catch (error) {
        alert("Error enviando pedido.");
      }
    }

    function crearReconocedor(callback, continuous = false) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Este navegador no soporta voz. Usa Chrome o Edge.");
        return null;
      }
      const rec = new SpeechRecognition();
      rec.lang = "es-MX";
      rec.continuous = continuous;
      rec.interimResults = false;
      rec.maxAlternatives = 1;
      rec.onresult = (event) => {
        const texto = event.results[event.results.length - 1][0].transcript.toLowerCase().trim();
        callback(texto);
      };
      rec.onerror = (event) => console.log("ERROR VOZ:", event.error);
      return rec;
    }

    function escucharCliente() {
      const rec = crearReconocedor((texto) => {
        mostrarMensaje("Cliente por voz: " + texto);
        seleccionarClientePorTexto(texto);
      });
      if (rec) {
        hablar("Di el nombre del cliente o tienda.");
        rec.start();
      }
    }

    function escucharProducto() {
      const rec = crearReconocedor((texto) => {
        mostrarMensaje("Producto por voz: " + texto);
        buscarProductoPorVoz(texto);
      });
      if (rec) {
        hablar("Di el nombre del producto.");
        rec.start();
      }
    }

    function escucharCantidad() {
      const rec = crearReconocedor((texto) => {
        const cantidad = convertirNumero(texto);
        document.getElementById("cantidadProducto").value = cantidad;
        hablar("Cantidad " + cantidad);
      });
      if (rec) {
        hablar("Di la cantidad.");
        rec.start();
      }
    }

    function activarModoVoz() {
      if (reconocimiento) reconocimiento.stop();
      reconocimiento = crearReconocedor(procesarComandoVoz, true);
      if (!reconocimiento) return;
      reconocimiento.start();
      document.getElementById("vozEstado").style.display = "block";
      hablar("Modo voz activado.");
    }

    function desactivarModoVoz() {
      if (reconocimiento) reconocimiento.stop();
      reconocimiento = null;
      document.getElementById("vozEstado").style.display = "none";
      hablar("Modo voz apagado.");
    }

    function buscarProductoPorVoz(texto) {
      const busqueda = normalizar(texto.replace(/^buscar\s+/, "").replace(/^producto\s+/, ""));
      document.getElementById("buscarProducto").value = busqueda;
      mostrarProductos();

      const encontrados = productos.filter(p => normalizar(`${obtenerNombreProducto(p)} ${obtenerDescripcionProducto(p)} ${p.Sku || ""}`).includes(busqueda));
      productoSeleccionadoVoz = encontrados[0] || null;

      if (encontrados.length === 1) hablar("Encontré " + obtenerNombreProducto(encontrados[0]) + ". Di agregar y la cantidad.");
      else if (encontrados.length > 1) hablar("Encontré varios productos. Toca el correcto o di agregar para usar el primero.");
      else hablar("No encontré el producto.");
    }

    function procesarComandoVoz(texto) {
      mostrarMensaje("Voz: " + texto);

      if (texto.startsWith("cliente ") || texto.startsWith("tienda ")) {
        seleccionarClientePorTexto(texto);
        return;
      }

      if (texto.startsWith("buscar ") || texto.startsWith("producto ")) {
        buscarProductoPorVoz(texto);
        return;
      }

      if (texto.startsWith("cantidad ")) {
        const cantidad = convertirNumero(texto.replace("cantidad ", ""));
        document.getElementById("cantidadProducto").value = cantidad;
        hablar("Cantidad " + cantidad);
        return;
      }

      if (texto.startsWith("agregar ") || texto.startsWith("agrega ")) {
        const numeroTexto = texto.replace("agregar", "").replace("agrega", "").trim();
        const cantidad = convertirNumero(numeroTexto);
        if (!productoSeleccionadoVoz) {
          const primeroVisible = document.querySelector(".producto");
          if (primeroVisible) {
            const id = primeroVisible.id.replace("producto-", "");
            productoSeleccionadoVoz = productos.find(p => String(p.Id) === String(id));
          }
        }
        if (!productoSeleccionadoVoz) {
          hablar("Primero busca un producto.");
          return;
        }
        agregarProducto(productoSeleccionadoVoz, cantidad);
        return;
      }

      if (texto === "total" || texto.includes("cuanto es")) {
        const total = pedido.reduce((sum, p) => sum + (p.precio * p.cantidad), 0);
        hablar("El total es " + total.toFixed(2) + " dólares.");
        return;
      }

      if (texto.includes("vaciar")) {
        vaciarPedido();
        return;
      }

      if (texto.includes("nuevo pedido")) {
        nuevoPedido();
        return;
      }

      if (texto.includes("crear factura") || texto.includes("enviar factura")) {
        crearFactura();
        return;
      }
    }

    function convertirNumero(texto) {
      texto = normalizar(texto);
      const mapa = {
        uno: 1, una: 1, dos: 2, tres: 3, cuatro: 4, cinco: 5,
        seis: 6, siete: 7, ocho: 8, nueve: 9, diez: 10,
        once: 11, doce: 12, trece: 13, catorce: 14, quince: 15,
        dieciseis: 16, diecisiete: 17, dieciocho: 18, diecinueve: 19,
        veinte: 20, treinta: 30, cuarenta: 40, cincuenta: 50,
        sesenta: 60, setenta: 70, ochenta: 80, noventa: 90, cien: 100
      };
      if (mapa[texto]) return mapa[texto];
      for (const palabra of texto.split(" ")) {
        if (mapa[palabra]) return mapa[palabra];
      }
      const numero = parseInt(texto.replace(/\D/g, ""), 10);
      return Number.isFinite(numero) && numero > 0 ? numero : 1;
    }

    cargarDatos();
  </script>
