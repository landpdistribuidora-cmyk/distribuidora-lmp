<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DISTRIBUIDORA L&P</title>
  <meta name="theme-color" content="#0666ff">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/jpeg" href="/images/logo-nuevo.jpg">
  <link rel="apple-touch-icon" href="/images/logo-nuevo.jpg">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#eef4fb;color:#111827}
    .header{background:linear-gradient(135deg,#007bff,#0056d6);text-align:center;padding:20px}.header img{max-width:330px;width:80%}
    .container{padding:20px}.panel,.productos-box,.pedido-box{background:#fff;border-radius:18px;padding:18px;box-shadow:0 4px 14px #00000014;margin-bottom:18px}
    .toolbar{display:grid;grid-template-columns:190px 1fr 1fr 180px;gap:14px;align-items:end}.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
    label{font-weight:700} select,input{width:100%;padding:12px;border:1px solid #ccc;border-radius:11px;font-size:16px;margin-top:7px}
    button,.image-button{border:0;border-radius:11px;padding:12px 18px;font-size:16px;font-weight:700;cursor:pointer;background:#0666ff;color:#fff}
    .dark{background:#1f2937}.green{background:#16a34a}.purple{background:#7c3aed}.yellow{background:#f59e0b;color:#111827}
    .layout{display:grid;grid-template-columns:2fr 1fr;gap:22px}.categorias{display:flex;gap:8px;flex-wrap:wrap}.categorias button{background:#fff;color:#1d4ed8;border:2px solid #1d4ed8}.categorias button.activo{background:#1d4ed8;color:#fff}
    .productos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px;margin-top:18px}.producto{border:1px solid #ddd;border-radius:16px;padding:14px;text-align:center;cursor:pointer;box-shadow:0 3px 10px #00000014;transition:.15s;background:#fff}.producto:hover{transform:scale(1.02)}.producto.arrastrando{border:3px dashed #16a34a;background:#ecfdf5}.producto img{width:125px;height:105px;object-fit:contain}.producto h3{font-size:17px;margin:9px 0}.producto p{font-size:18px;color:#1d4ed8;font-weight:700}.categoria-editor{margin-top:9px;padding:8px;font-size:13px;border-color:#7c3aed;background:#faf5ff}.image-button{display:block;margin-top:10px}.paginacion-productos{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-top:20px}.paginacion-productos button{padding:9px 13px}.paginacion-productos button:disabled{opacity:.45;cursor:not-allowed}.pagina-indicador{font-weight:700;color:#1d4ed8}
    .pedido-box{height:max-content}.pedido-header{display:flex;justify-content:space-between;align-items:center}.contador{background:#1d4ed8;color:#fff;border-radius:14px;padding:7px 11px;font-weight:700}.pedido-item{border-left:5px solid #1d4ed8;background:#f8fafc;border-radius:11px;padding:10px;margin-bottom:10px}.pedido-controles button{padding:7px 11px;margin:4px}.total{font-size:30px;color:#1d4ed8;font-weight:700;text-align:center;background:#eaf2ff;padding:16px;border-radius:16px;margin:16px 0}.pedido-resumen-movil{display:none}.ordenes-pendientes{border-left:5px solid #f59e0b}.ordenes-modal{position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;padding:18px;background:#0f172acc}.ordenes-modal-contenido{width:min(820px,100%);max-height:88vh;overflow-y:auto;background:#fff;border-radius:18px;padding:18px;box-shadow:0 10px 40px #0008}.ordenes-modal-cabecera{display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:-18px;background:#fff;padding:0 0 12px;z-index:2}.ordenes-modal-cabecera h2{margin:0}.ordenes-modal-cerrar{background:#1f2937;padding:8px 12px}.orden-pendiente{border:1px solid #fbbf24;background:#fffbeb;border-radius:12px;padding:12px;margin-top:10px}.orden-pendiente h3{margin:0 0 5px;font-size:17px}.orden-pendiente ul{margin:8px 0;padding-left:22px}.orden-pendiente-acciones{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.orden-pendiente-acciones button{padding:9px 12px}.orden-pendiente-acciones .rechazar{background:#b91c1c}
    .mensaje,.voz{display:none;padding:11px;border-radius:11px;margin-top:10px;font-weight:700}.mensaje{background:#eaf2ff;color:#1d4ed8}.voz{background:#dcfce7;color:#166534}.cliente-info{background:#f8fafc;border-left:5px solid #16a34a;padding:10px;border-radius:11px;margin-top:12px;white-space:pre-line}
    .login-pantalla{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:18px;background:linear-gradient(135deg,#eef4fb,#dbeafe)}.login-pantalla.oculto{display:none}.login-card{width:min(420px,100%);background:#fff;border-radius:20px;padding:24px;box-shadow:0 8px 28px #00000024;text-align:center}.login-card img{width:min(250px,80%);max-height:110px;object-fit:contain}.login-card h1{font-size:24px;margin:12px 0 6px}.login-card p{margin:0 0 16px;color:#475569}.login-card button{width:100%;margin-top:14px;min-height:48px}.login-error{display:none;background:#fee2e2;color:#991b1b;border-radius:10px;padding:10px;margin-top:12px;font-weight:700}
    @media(min-width:901px){.categorias{position:sticky;top:0;z-index:10;background:#fff;padding:10px 0;box-shadow:0 3px 8px #00000010}.pedido-box{position:sticky;top:18px;align-self:start;max-height:calc(100vh - 36px);overflow-y:auto}}
    @media(max-width:900px){.toolbar,.layout{grid-template-columns:1fr}.pedido-box{position:relative}.container{padding:10px}.actions button{width:100%}}
    @media(max-width:600px){
      body{font-size:15px;overflow-x:hidden;padding-bottom:66px}
      .header{padding:12px 10px}.header img{width:92%;max-width:270px}
      .container{padding:8px}.panel,.productos-box,.pedido-box{padding:12px;border-radius:13px;margin-bottom:12px}
      .actions{display:grid;grid-template-columns:1fr;gap:8px}.actions button,.pedido-box>button{width:100%;min-height:46px}
      .toolbar{gap:10px}.toolbar label{font-size:15px}select,input{min-height:46px;font-size:16px;padding:11px}
      .layout{gap:12px}.productos-box h2{font-size:21px;margin:4px 0 8px}.categorias{position:sticky;top:0;z-index:10;background:#fff;gap:6px;flex-wrap:wrap;overflow:visible;padding:8px 0 6px}.categorias button{flex:0 0 auto;padding:9px 12px;font-size:14px}
      .productos-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.producto{padding:8px;border-radius:12px}.producto img{width:100%;height:94px}.producto h3{font-size:14px;line-height:1.2;min-height:34px;margin:7px 0}.producto p{font-size:16px;margin:7px 0}.paginacion-productos{gap:6px;margin-top:14px}.paginacion-productos button{padding:8px 10px;font-size:14px}
      .pedido-header h2{font-size:20px}.contador{font-size:13px;padding:6px 8px}.pedido-item{padding:9px;font-size:14px}.pedido-controles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.pedido-controles button{margin:0;min-height:42px;padding:7px}.total{font-size:24px;padding:13px;margin:12px 0}.ordenes-modal{padding:8px}.ordenes-modal-contenido{max-height:92vh;padding:12px}.ordenes-modal-cabecera{top:-12px}
      #clienteInfo{font-size:14px}.mensaje,.voz{font-size:14px}.pedido-resumen-movil{position:fixed;display:flex;align-items:center;justify-content:space-between;gap:8px;left:0;right:0;bottom:0;z-index:50;padding:9px 10px calc(9px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #cbd5e1;box-shadow:0 -4px 14px #0002}.pedido-resumen-movil strong{color:#1d4ed8;font-size:17px}.pedido-resumen-movil button{padding:9px 12px;font-size:14px;white-space:nowrap}.orden-pendiente-acciones button{flex:1;min-width:130px}
    }
    @media(max-width:370px){.productos-grid{grid-template-columns:1fr}.producto img{height:110px}}
  </style>
</head>
<body>
  <div id="loginPantalla" class="login-pantalla">
    <div class="login-card">
      <img src="images/logo-nuevo.jpg" alt="Distribuidora L&P">
      <h1>Acceso a Distribuidora L&amp;P</h1>
      <p>Selecciona tu tipo de acceso</p>
      <select id="loginRol">
        <option value="empleado">Empleado</option>
        <option value="cliente">Cliente</option>
        <option value="jefe">Jefe / desarrollador</option>
      </select>
      <input id="loginPassword" type="password" placeholder="Contraseña" autocomplete="current-password" onkeydown="if(event.key==='Enter')iniciarSesion()">
      <button class="purple" onclick="iniciarSesion()">Entrar</button>
      <div id="loginError" class="login-error"></div>
    </div>
  </div>
  <div class="header"><img src="images/logo-nuevo.jpg" alt="Distribuidora L&P"></div>
  <div class="container">
    <div class="panel">
      <div class="actions"><button id="btnConectar" class="purple" style="display:none" onclick="window.open('/connect-qbo','_blank')">Conectar QuickBooks</button><button id="btnCapturador" class="dark" style="display:none" onclick="window.open('/capturador_codigos_camara.html','_blank')">Capturar códigos</button><button id="btnOrdenesPendientes" class="yellow" style="display:none" onclick="abrirVentanaOrdenes()">Pedidos pendientes (<span id="ordenesPendientesContador">0</span>)</button><button class="dark" onclick="cargarDatos()">Recargar datos</button><button class="dark" onclick="cerrarSesion()">Salir</button></div>
      <div class="toolbar">
        <div><label>Tipo de usuario</label><select id="tipoUsuario"><option value="empleado">Empleado</option><option value="cliente">Cliente</option></select></div>
        <div><label>Cliente / Tienda</label><input id="buscarCliente" placeholder="Buscar cliente..." oninput="filtrarClientes()"><select id="cliente" onchange="actualizarCliente()"></select></div>
        <div><label>Buscar artículo</label><input id="buscarProducto" placeholder="Buscar artículo..." oninput="paginaActual=1;mostrarProductos()"></div>
        <div><label>Cantidad</label><input id="cantidadProducto" type="number" min="1" value="1"></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 180px;gap:12px;margin-top:12px"><input id="notaPedido" placeholder="Nuevo pedido"><button id="btnVoz" class="green" onclick="toggleVoz()">🎤 Escuchar</button></div>
      <div style="display:grid;grid-template-columns:1fr 180px;gap:12px;margin-top:12px"><input id="codigoBarras" inputmode="numeric" placeholder="Escanear código de barras" onkeydown="if(event.key==='Enter')buscarPorCodigoBarras()"><button type="button" class="dark" onclick="abrirCamaraCodigo()">📷 Escanear código</button></div>
      <div id="lectorCodigoBarras" style="display:none;margin-top:10px"></div>
      <div id="clienteInfo" class="cliente-info">Cliente seleccionado: ninguno</div><div id="mensaje" class="mensaje"></div><div id="vozEstado" class="voz">🎤 Escuchando</div>
    </div>
    <div id="ordenesPendientesModal" class="ordenes-modal" role="dialog" aria-modal="true" aria-labelledby="ordenesPendientesTitulo"><section class="ordenes-modal-contenido"><div class="ordenes-modal-cabecera"><h2 id="ordenesPendientesTitulo">Pedidos pendientes</h2><div><button class="dark" onclick="cargarOrdenesPendientes()">Actualizar</button><button class="ordenes-modal-cerrar" onclick="cerrarVentanaOrdenes()">Cerrar</button></div></div><div id="ordenesPendientes"><p>No hay pedidos pendientes.</p></div></section></div>
    <div class="layout">
      <div class="productos-box"><h2>Artículos</h2><div class="categorias" id="categorias"></div><div id="productos" class="productos-grid"></div><div id="paginacionProductos" class="paginacion-productos"></div></div>
      <div class="pedido-box"><div class="pedido-header"><h2>🛒 Pedido</h2><span id="contador" class="contador">0 productos</span></div><div id="pedido"></div><div id="total" class="total">Total: $0.00</div><button onclick="crearFactura()">Crear factura</button><button class="dark" onclick="vaciarPedido()">Vaciar pedido</button><button class="dark" onclick="nuevoPedido()">Nuevo pedido</button></div>
    </div>
  </div>
  <div id="pedidoResumenMovil" class="pedido-resumen-movil"><strong id="pedidoResumenTexto">0 productos · $0.00</strong><button class="purple" onclick="verPedidoMovil()">Ver carrito</button></div>
<script>
let productos=[],clientes=[],pedido=[],ordenesPendientes=[],categoriaActual='Todos',paginaActual=1,productosPorPagina=24,reconocimiento=null,vozActiva=false,reinicioVozTimer=null,aliases={},rolActual='',actualizacionSilenciosa=false,actualizacionEnCurso=false,actualizacionTimer=null,mapaCategoriasPersistentes={},lectorCodigo=null,lectorCodigoActivo=false;
const categoriasIniciales=['Abarrotes','Sabritas','Galletas','Dulces','Bebidas','Otros'];
function normalizar(t){return String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}
function sinPrefijoQuickBooks(t){const texto=String(t||'').trim();const separador=texto.lastIndexOf(':');return (separador>=0?texto.slice(separador+1):texto).trim()}
function limpiarNombreArchivo(t){return normalizar(t).replace(/\s+/g,'-')}
function mostrarMensaje(t){if(actualizacionSilenciosa)return;const e=document.getElementById('mensaje');e.textContent=t;e.style.display='block';clearTimeout(e.timer);e.timer=setTimeout(()=>e.style.display='none',3500)}
function mostrarLoginError(t){const e=document.getElementById('loginError');e.textContent=t;e.style.display=t?'block':'none'}
function aplicarRol(rol){rolActual=rol;document.getElementById('loginPantalla').classList.add('oculto');const tipo=document.getElementById('tipoUsuario');tipo.value=rol==='cliente'?'cliente':'empleado';tipo.disabled=rol!=='jefe';document.getElementById('btnConectar').style.display=rol==='jefe'?'':'none';document.getElementById('btnCapturador').style.display=(rol==='empleado'||rol==='jefe')?'':'none';actualizarPanelOrdenes();cargarDatos();iniciarActualizacionAutomatica()}
async function iniciarSesion(){const rol=document.getElementById('loginRol').value;const contrasena=document.getElementById('loginPassword').value;mostrarLoginError('');try{const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rol,contrasena})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'No se pudo iniciar sesión');document.getElementById('loginPassword').value='';aplicarRol(d.rol)}catch(e){mostrarLoginError(e.message)}}
async function cerrarSesion(){try{await fetch('/logout',{method:'POST'})}finally{location.reload()}}
async function verificarSesion(){try{const r=await fetch('/session',{cache:'no-store'});const d=await r.json();if(d.autenticado)aplicarRol(d.rol)}catch(e){mostrarLoginError('No se pudo verificar el acceso.')}}
function actualizarDatosSilenciosamente(){if(!rolActual||actualizacionEnCurso)return;actualizacionEnCurso=true;actualizacionSilenciosa=true;Promise.resolve(cargarDatos()).finally(()=>{actualizacionSilenciosa=false;actualizacionEnCurso=false})}
function iniciarActualizacionAutomatica(){if(actualizacionTimer)clearInterval(actualizacionTimer);actualizacionTimer=setInterval(actualizarDatosSilenciosamente,60000)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)actualizarDatosSilenciosamente()})
function claveProducto(p){return p.catalogo?.productoQuickBooksPrincipal||p.Sku||p.Name||p.Id}
function nombreProducto(p){return p.catalogo?.nombreVisible||sinPrefijoQuickBooks(p.Name||p.FullyQualifiedName)||'Producto sin nombre'}
function nombreQuickBooks(p){return sinPrefijoQuickBooks(p.Name||p.FullyQualifiedName||nombreProducto(p))||nombreProducto(p)}
function precioProducto(p){return Number(p.UnitPrice||0)}
function descripcionProducto(p){return sinPrefijoQuickBooks(p.Description||'')||p.catalogo?.nombreVisible||nombreProducto(p)}
function imagenProducto(p){if(p.imagenTemporal)return p.imagenTemporal;if(p.imagen)return p.imagen;if(p.catalogo?.imagen)return p.catalogo.imagen;return `images/productos/${limpiarNombreArchivo(claveProducto(p))}.jpg`}
async function cargarImagenesPersistentes(){try{const r=await fetch('/api/imagenes-productos',{cache:'no-store'});if(r.ok)return await r.json()}catch(e){console.error('No se pudo cargar el mapa de imágenes:',e)}return{}}
async function cargarCategoriasPersistentes(){try{const r=await fetch('/api/categorias-productos',{cache:'no-store'});if(r.ok)return await r.json()}catch(e){console.error('No se pudo cargar el mapa de categorías:',e)}return{}}
async function cargarDatos(){try{mostrarMensaje('Cargando datos...');try{aliases=await (await fetch('/aliases.json')).json()}catch{aliases={}}const cat=await (await fetch('/catalogo_maestro_sistema.json',{cache:'no-store'})).json();const imagenesPersistentes=await cargarImagenesPersistentes();mapaCategoriasPersistentes=await cargarCategoriasPersistentes();const mapa={};const agregarClave=(clave,producto)=>{if(!clave)return;mapa[normalizar(clave)]=producto;const sinPrefijo=sinPrefijoQuickBooks(clave);if(sinPrefijo)mapa[normalizar(sinPrefijo)]=producto};(cat.productos||[]).forEach(i=>{const imagenPersistente=imagenesPersistentes[i.productoQuickBooksPrincipal];if(imagenPersistente)i.imagen=imagenPersistente;[i.productoQuickBooksPrincipal,...(i.productosQuickBooksEquivalentes||[])].filter(Boolean).forEach(c=>agregarClave(c,i))});const cr=await fetch('/clientes');const cd=await cr.json();if(!cr.ok)throw new Error(cd.error||'Error clientes');clientes=(cd.clientes||cd.QueryResponse?.Customer||[]).map(c=>({id:c.id||c.Id,nombre:c.nombre||c.DisplayName||c.FullyQualifiedName||'Cliente',email:c.email||c.PrimaryEmailAddr?.Address||''}));llenarClientes(clientes);const pr=await fetch('/productos');const pd=await pr.json();if(!pr.ok)throw new Error(pd.error||'Error productos');productos=(pd.productos||pd.QueryResponse?.Item||[]).map(p=>{const id=p.id||p.Id;const nombreQbo=p.nombre||p.Name||p.FullyQualifiedName||'Producto';const nombreSinPrefijo=sinPrefijoQuickBooks(nombreQbo);const sku=p.sku||p.Sku||p.SKU||'';const catalogo=mapa[normalizar(nombreQbo)]||mapa[normalizar(nombreSinPrefijo)]||mapa[normalizar(sku)]||null;return {id,Id:id,Name:nombreQbo,FullyQualifiedName:nombreQbo,Description:p.descripcion||p.Description||'',UnitPrice:Number(p.precio??p.UnitPrice??0),Sku:sku,catalogo,categoria:mapaCategoriasPersistentes[String(id)]||catalogo?.categoria||'Sin categoría'}});crearCategorias();mostrarProductos();mostrarPedido();actualizarCliente();if(rolActual==='empleado'||rolActual==='jefe')cargarOrdenesPendientes();mostrarMensaje(`Listo. ${clientes.length} clientes y ${productos.length} productos.`)}catch(e){console.error(e);mostrarMensaje('Error: '+e.message)}}
function escaparHtml(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function actualizarPanelOrdenes(){const boton=document.getElementById('btnOrdenesPendientes');if(!boton)return;const puedeVer=rolActual==='empleado'||rolActual==='jefe';boton.style.display=puedeVer?'':'none';if(!puedeVer)cerrarVentanaOrdenes();if(puedeVer)cargarOrdenesPendientes()}
function abrirVentanaOrdenes(){const modal=document.getElementById('ordenesPendientesModal');if(!modal)return;modal.style.display='flex';cargarOrdenesPendientes()}
function cerrarVentanaOrdenes(){const modal=document.getElementById('ordenesPendientesModal');if(modal)modal.style.display='none'}
function totalOrden(items){return (Array.isArray(items)?items:[]).reduce((s,i)=>s+Number(i.precio??i.unitPrice??i.price??0)*Number(i.cantidad??i.qty??i.quantity??1),0)}
async function cargarOrdenesPendientes(){if(rolActual!=='empleado'&&rolActual!=='jefe')return;try{const r=await fetch('/orders',{cache:'no-store'});const data=await r.json().catch(()=>[]);if(!r.ok)throw new Error(data.error||'No se pudieron cargar los pedidos');ordenesPendientes=(Array.isArray(data)?data:data.orders||[]).filter(o=>String(o.status||'')==='pending').sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')));const contador=document.getElementById('ordenesPendientesContador');if(contador)contador.textContent=ordenesPendientes.length;mostrarOrdenesPendientes()}catch(e){console.error(e);const contador=document.getElementById('ordenesPendientesContador');if(contador)contador.textContent='!';const cont=document.getElementById('ordenesPendientes');if(cont)cont.innerHTML='<p>No se pudieron cargar los pedidos pendientes.</p>'}}
function mostrarOrdenesPendientes(){const cont=document.getElementById('ordenesPendientes');if(!cont)return;if(!ordenesPendientes.length){cont.innerHTML='<p>No hay pedidos pendientes.</p>';return}cont.innerHTML='';ordenesPendientes.forEach(o=>{const items=Array.isArray(o.items)?o.items:[];const fecha=o.createdAt?new Date(o.createdAt).toLocaleString('es-MX'):'';const lineas=items.map(i=>`<li>${escaparHtml(i.nombre||i.name||i.qboNombre||'Producto')} × ${Number(i.cantidad??i.qty??i.quantity??1)} — $${(Number(i.precio??i.unitPrice??i.price??0)*Number(i.cantidad??i.qty??i.quantity??1)).toFixed(2)}</li>`).join('');const card=document.createElement('article');card.className='orden-pendiente';card.dataset.ordenId=String(o.id);card.innerHTML=`<h3>${escaparHtml(o.customerName||o.customer?.name||'Cliente')}</h3><div>${escaparHtml(fecha)} · Total: <strong>$${totalOrden(items).toFixed(2)}</strong></div><ul>${lineas||'<li>Sin productos</li>'}</ul><div class="orden-pendiente-acciones"><button type="button" class="green">Aprobar y facturar</button><button type="button" class="rechazar">Rechazar</button></div>`;card.querySelector('.green').addEventListener('click',()=>aprobarOrden(o.id));card.querySelector('.rechazar').addEventListener('click',()=>rechazarOrden(o.id));cont.appendChild(card)})}

const NUMEROS_VOZ={cero:0,un:1,uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,dieciseis:16,dieciséis:16,diecisiete:17,dieciocho:18,diecinueve:19,veinte:20};

function toggleVoz(){vozActiva?desactivarVoz():activarVoz()}
function activarVoz(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert('Usa Chrome o Edge para la voz.');vozActiva=true;reconocimiento=new SR();reconocimiento.lang='es-MX';reconocimiento.continuous=true;reconocimiento.interimResults=false;reconocimiento.maxAlternatives=5;reconocimiento.onresult=e=>{const resultado=e.results[e.results.length-1];const opciones=Array.from(resultado).map(x=>x.transcript.trim()).filter(Boolean);let entendido=false;for(const opcion of opciones){if(procesarVoz(opcion,true)){entendido=true;break}}if(!entendido&&opciones[0]){mostrarMensaje('No entendí: '+opciones[0]);hablar('No encontré el producto.')}};reconocimiento.onend=()=>{if(vozActiva)reinicioVozTimer=setTimeout(()=>{try{reconocimiento.start()}catch{}},700)};document.getElementById('vozEstado').style.display='block';document.getElementById('btnVoz').textContent='🎤 Escuchando';hablar('Modo voz activado.');setTimeout(()=>{try{reconocimiento.start()}catch{}},500)}
function desactivarVoz(){vozActiva=false;clearTimeout(reinicioVozTimer);try{reconocimiento?.stop()}catch{}document.getElementById('vozEstado').style.display='none';document.getElementById('btnVoz').textContent='🎤 Escuchar'}
function procesarVoz(t,mostrar=true){const q=normalizar(t);if(mostrar)mostrarMensaje('Voz: '+t);if(q.includes('apagar voz')||q.includes('detener voz')||q.includes('parar voz')){desactivarVoz();return true}if(q.includes('vaciar pedido')||q==='vaciar'||q.includes('borrar pedido')){vaciarPedido();return true}if(q.includes('quitar ultimo')||q.includes('quitar el ultimo')||q.includes('borrar ultimo')){if(pedido.length)pedido.pop();mostrarPedido();return true}if(q.includes('nuevo pedido')){nuevoPedido();return true}if(q.includes('crear factura')||q.includes('crea factura')||q.includes('hacer factura')||q.includes('enviar factura')||q.includes('manda factura')){crearFactura();return true}if(q.includes('total')||q.includes('cuanto es')||q.includes('cuanto sale')){const total=pedido.reduce((s,i)=>s+i.precio*i.cantidad,0);hablar('El total es '+total.toFixed(2)+' dólares.');return true}const extraido=extraerCantidadVoz(t);const p=buscarProductoVoz(extraido.consulta);if(p){agregarProducto(p,extraido.cantidad);return true}return false}
verificarSesion();
</script>
